          If podSelector is also set, then the NetworkPolicyPeer as a whole selects
          the pods matching podSelector in the namespaces selected by namespaceSelector.
          Otherwise it selects all pods in the namespaces selected by namespaceSelector.
          +optional
      podSelector:
        allOf:
        - $ref: '#/definitions/v1.LabelSelector'
        description: |-
          podSelector is a label selector which selects pods. This field follows standard label
          selector semantics; if present but empty, it selects all pods.

          If namespaceSelector is also set, then the NetworkPolicyPeer as a whole selects
          the pods matching podSelector in the Namespaces selected by NamespaceSelector.
          Otherwise it selects the pods matching podSelector in the policy's own namespace.
          +optional
    type: object
  v1.NetworkPolicyPort:
    properties:
      endPort:
        description: |-
          endPort indicates that the range of ports from port to endPort if set, inclusive,
          should be allowed by the policy. This field cannot be defined if the port field
          is not defined or if the port field is defined as a named (string) port.
          The endPort must be equal or greater than port.
          +optional
        type: integer
      port:
        allOf:
        - $ref: '#/definitions/intstr.IntOrString'
        description: |-
          port represents the port on the given protocol. This can either be a numerical or named
          port on a pod. If this field is not provided, this matches all port names and
          numbers.
          If present, only traffic on the specified protocol AND port will be matched.
          +optional
      protocol:
        allOf:
        - $ref: '#/definitions/v1.Protocol'
        description: |-
          protocol represents the protocol (TCP, UDP, or SCTP) which traffic must match.
          If not specified, this field defaults to TCP.
          +optional
    type: object
  v1.NetworkPolicySpec:
    properties:
      egress:
        description: |-
          egress is a list of egress rules to be applied to the selected pods. Outgoing traffic
          is allowed if there are no NetworkPolicies selecting the pod (and cluster policy
          otherwise allows the traffic), OR if the traffic matches at least one egress rule
          across all of the NetworkPolicy objects whose podSelector matches the pod. If
          this field is empty then this NetworkPolicy limits all outgoing traffic (and serves
          solely to ensure that the pods it selects are isolated by default).
          This field is beta-level in 1.8
          +optional
          +listType=atomic
        items:
          $ref: '#/definitions/v1.NetworkPolicyEgressRule'
        type: array
      ingress:
        description: |-
          ingress is a list of ingress rules to be applied to the selected pods.
          Traffic is allowed to a pod if there are no NetworkPolicies selecting the pod
          (and cluster policy otherwise allows the traffic), OR if the traffic source is
          the pod's local node, OR if the traffic matches at least one ingress rule
          across all of the NetworkPolicy objects whose podSelector matches the pod. If
          this field is empty then this NetworkPolicy does not allow any traffic (and serves
          solely to ensure that the pods it selects are isolated by default)
          +optional
          +listType=atomic
        items:
          $ref: '#/definitions/v1.NetworkPolicyIngressRule'
        type: array
      podSelector:
        allOf:
        - $ref: '#/definitions/v1.LabelSelector'
        description: |-
          podSelector selects the pods to which this NetworkPolicy object applies.
          The array of rules is applied to any pods selected by this field. An empty
          selector matches all pods in the policy's namespace.
          Multiple network policies can select the same set of pods. In this case,
          the ingress rules for each are combined additively.
          This field is optional. If it is not specified, it defaults to an empty selector.
          +optional
      policyTypes:
        description: |-
          policyTypes is a list of rule types that the NetworkPolicy relates to.
          Valid options are ["Ingress"], ["Egress"], or ["Ingress", "Egress"].
          If this field is not specified, it will default based on the existence of ingress or egress rules;
          policies that contain an egress section are assumed to affect egress, and all policies
          (whether or not they contain an ingress section) are assumed to affect ingress.
          If you want to write an egress-only policy, you must explicitly specify policyTypes [ "Egress" ].
          Likewise, if you want to write a policy that specifies that no egress is allowed,
          you must specify a policyTypes value that include "Egress" (since such a policy would not include
          an egress section and would otherwise default to just [ "Ingress" ]).
          This field is beta-level in 1.8
          +optional
          +listType=atomic
        items:
          $ref: '#/definitions/k8s_io_api_networking_v1.PolicyType'
        type: array
