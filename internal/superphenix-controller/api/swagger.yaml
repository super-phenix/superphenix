        description: |-
          PersistentVolumeClaimVolumeSource represents a reference to a PersistentVolumeClaim in the same namespace.
          Directly attached to the vmi via qemu.
          More info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#persistentvolumeclaims
          +optional
    type: object
  kubevirt_io_api_core_v1.Interface:
    properties:
      acpiIndex:
        description: |-
          If specified, the ACPI index is used to provide network interface device naming, that is stable across changes
          in PCI addresses assigned to the device.
          This value is required to be unique across all devices and be between 1 and (16*1024-1).
          +optional
        type: integer
      binding:
        allOf:
        - $ref: '#/definitions/v1.PluginBinding'
        description: |-
          Binding specifies the binding plugin that will be used to connect the interface to the guest.
          It provides an alternative to InterfaceBindingMethod.
          version: 1alphav1
      bootOrder:
        description: |-
          BootOrder is an integer value > 0, used to determine ordering of boot devices.
          Lower values take precedence.
          Each interface or disk that has a boot order must have a unique value.
          Interfaces without a boot order are not tried.
          +optional
        type: integer
      bridge:
        $ref: '#/definitions/v1.InterfaceBridge'
      dhcpOptions:
        allOf:
        - $ref: '#/definitions/v1.DHCPOptions'
        description: |-
          If specified the network interface will pass additional DHCP options to the VMI
          +optional
      macAddress:
        description: 'Interface MAC address. For example: de:ad:00:00:be:af or DE-AD-00-00-BE-AF.'
        type: string
      macvtap:
        allOf:
        - $ref: '#/definitions/v1.DeprecatedInterfaceMacvtap'
        description: |-
          DeprecatedMacvtap is an alias to the deprecated Macvtap interface,
          please refer to Kubevirt user guide for alternatives.
          Deprecated: Removed in v1.3
          +optional
      masquerade:
        $ref: '#/definitions/v1.InterfaceMasquerade'
      model:
        description: |-
          Interface model.
          One of: e1000, e1000e, igb, ne2k_pci, pcnet, rtl8139, virtio.
          Defaults to virtio.
          TODO:(ihar) switch to enums once opengen-api supports them. See: https://github.com/kubernetes/kube-openapi/issues/51
        type: string
      name:
        description: |-
          Logical name of the interface as well as a reference to the associated networks.
          Must match the Name of a Network.
        type: string
      passt:
        allOf:
        - $ref: '#/definitions/v1.DeprecatedInterfacePasst'
        description: |-
          DeprecatedPasst is an alias to the deprecated Passt interface,
          please refer to Kubevirt user guide for alternatives.
          Deprecated: Removed in v1.3
          +optional
      pciAddress:
        description: |-
          If specified, the virtual network interface will be placed on the guests pci address with the specified PCI address. For example: 0000:81:01.10
          +optional
        type: string
      ports:
        description: List of ports to be forwarded to the virtual machine.
        items:
          $ref: '#/definitions/v1.Port'
        type: array
      slirp:
        allOf:
        - $ref: '#/definitions/v1.DeprecatedInterfaceSlirp'
        description: |-
          DeprecatedSlirp is an alias to the deprecated Slirp interface
          Deprecated: Removed in v1.3
      sriov:
        $ref: '#/definitions/v1.InterfaceSRIOV'
      state:
        allOf:
        - $ref: '#/definitions/v1.InterfaceState'
        description: |-
          State represents the requested operational state of the interface.
          The supported values are:
          `absent`, expressing a request to remove the interface.
          `down`, expressing a request to set the link down.
          `up`, expressing a request to set the link up.
          Empty value functions as `up`.
          +optional
      tag:
        description: |-
          If specified, the virtual network interface address and its tag will be provided to the guest via config drive
          +optional
        type: string
    type: object
  kubevirt_io_api_core_v1.PersistentVolumeClaimVolumeSource:
    properties:
      claimName:
        description: |-
          claimName is the name of a PersistentVolumeClaim in the same namespace as the pod using this volume.
          More info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#persistentvolumeclaims
        type: string
      hotpluggable:
        description: |-
          Hotpluggable indicates whether the volume can be hotplugged and hotunplugged.
          +optional
        type: boolean
      readOnly:
        description: |-
          readOnly Will force the ReadOnly setting in VolumeMounts.
          Default false.
          +optional
        type: boolean
    type: object
  kubevirt_io_api_core_v1.Probe:
    properties:
      exec:
        allOf:
        - $ref: '#/definitions/v1.ExecAction'
        description: |-
          One and only one of the following should be specified.
          Exec specifies the action to take, it will be executed on the guest through the qemu-guest-agent.
          If the guest agent is not available, this probe will fail.
          +optional
      failureThreshold:
        description: |-
          Minimum consecutive failures for the probe to be considered failed after having succeeded.
          Defaults to 3. Minimum value is 1.
          +optional
        type: integer
      guestAgentPing:
        allOf:
        - $ref: '#/definitions/v1.GuestAgentPing'
        description: |-
          GuestAgentPing contacts the qemu-guest-agent for availability checks.
          +optional
      httpGet:
        allOf:
        - $ref: '#/definitions/v1.HTTPGetAction'
        description: |-
          HTTPGet specifies the http request to perform.
          +optional
      initialDelaySeconds:
        description: |-
          Number of seconds after the VirtualMachineInstance has started before liveness probes are initiated.
          More info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#container-probes
          +optional
        type: integer
      periodSeconds:
        description: |-
          How often (in seconds) to perform the probe.
          Default to 10 seconds. Minimum value is 1.
          +optional
        type: integer
      successThreshold:
        description: |-
          Minimum consecutive successes for the probe to be considered successful after having failed.
          Defaults to 1. Must be 1 for liveness. Minimum value is 1.
          +optional
        type: integer
      tcpSocket:
        allOf:
        - $ref: '#/definitions/v1.TCPSocketAction'
        description: |-
          TCPSocket specifies an action involving a TCP port.
          TCP hooks not yet supported
          TODO: implement a realistic TCP lifecycle hook
          +optional
      timeoutSeconds:
        description: |-
          Number of seconds after which the probe times out.
          For exec probes the timeout fails the probe but does not terminate the command running on the guest.
          This means a blocking command can result in an increasing load on the guest.
          A small buffer will be added to the resulting workload exec probe to compensate for delays
          caused by the qemu guest exec mechanism.
          Defaults to 1 second. Minimum value is 1.
          More info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#container-probes
          +optional
        type: integer
    type: object
  kubevirt_io_api_core_v1.ResourceRequirements:
    properties:
      limits:
        allOf:
        - $ref: '#/definitions/v1.ResourceList'
        description: |-
          Limits describes the maximum amount of compute resources allowed.
          Valid resource keys are "memory" and "cpu".
          +optional
      overcommitGuestOverhead:
        description: |-
          Don't ask the scheduler to take the guest-management overhead into account. Instead
          put the overhead only into the container's memory limit. This can lead to crashes if
          all memory is in use on a node. Defaults to false.
        type: boolean
      requests:
        allOf:
        - $ref: '#/definitions/v1.ResourceList'
        description: |-
          Requests is a description of the initial vmi resources.
          Valid resource keys are "memory" and "cpu".
          +optional
    type: object
  kubevirt_io_api_core_v1.SecretVolumeSource:
    properties:
      optional:
        description: |-
          Specify whether the Secret or it's keys must be defined
          +optional
        type: boolean
      secretName:
        description: |-
          Name of the secret in the pod's namespace to use.
          More info: https://kubernetes.io/docs/concepts/storage/volumes#secret
        type: string
      volumeLabel:
        description: |-
          The volume label of the resulting disk inside the VMI.
          Different bootstrapping mechanisms require different values.
          Typical values are "cidata" (cloud-init), "config-2" (cloud-init) or "OEMDRV" (kickstart).
          +optional
        type: string
    type: object
  kubevirt_io_api_core_v1.Volume:
    properties:
      cloudInitConfigDrive:
        allOf:
        - $ref: '#/definitions/v1.CloudInitConfigDriveSource'
        description: |-
          CloudInitConfigDrive represents a cloud-init Config Drive user-data source.
          The Config Drive data will be added as a disk to the vmi. A proper cloud-init installation is required inside the guest.
          More info: https://cloudinit.readthedocs.io/en/latest/topics/datasources/configdrive.html
          +optional
      cloudInitNoCloud:
        allOf:
        - $ref: '#/definitions/v1.CloudInitNoCloudSource'
        description: |-
          CloudInitNoCloud represents a cloud-init NoCloud user-data source.
          The NoCloud data will be added as a disk to the vmi. A proper cloud-init installation is required inside the guest.
          More info: http://cloudinit.readthedocs.io/en/latest/topics/datasources/nocloud.html
          +optional
      configMap:
        allOf:
        - $ref: '#/definitions/kubevirt_io_api_core_v1.ConfigMapVolumeSource'
        description: |-
          ConfigMapSource represents a reference to a ConfigMap in the same namespace.
          More info: https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/
          +optional
      containerDisk:
        allOf:
        - $ref: '#/definitions/v1.ContainerDiskSource'
        description: |-
          ContainerDisk references a docker image, embedding a qcow or raw disk.
          More info: https://kubevirt.gitbooks.io/user-guide/registry-disk.html
          +optional
      dataVolume:
        allOf:
        - $ref: '#/definitions/v1.DataVolumeSource'
        description: |-
          DataVolume represents the dynamic creation a PVC for this volume as well as
          the process of populating that PVC with a disk image.
          +optional
      downwardAPI:
        allOf:
        - $ref: '#/definitions/kubevirt_io_api_core_v1.DownwardAPIVolumeSource'
        description: |-
          DownwardAPI represents downward API about the pod that should populate this volume
          +optional
      downwardMetrics:
        allOf:
        - $ref: '#/definitions/v1.DownwardMetricsVolumeSource'
        description: |-
          DownwardMetrics adds a very small disk to VMIs which contains a limited view of host and guest
          metrics. The disk content is compatible with vhostmd (https://github.com/vhostmd/vhostmd) and vm-dump-metrics.
      emptyDisk:
        allOf:
        - $ref: '#/definitions/v1.EmptyDiskSource'
        description: |-
          EmptyDisk represents a temporary disk which shares the vmis lifecycle.
          More info: https://kubevirt.gitbooks.io/user-guide/disks-and-volumes.html
          +optional
      ephemeral:
        allOf:
        - $ref: '#/definitions/kubevirt_io_api_core_v1.EphemeralVolumeSource'
        description: |-
          Ephemeral is a special volume source that "wraps" specified source and provides copy-on-write image on top of it.
          +optional
      hostDisk:
        allOf:
        - $ref: '#/definitions/v1.HostDisk'
        description: |-
          HostDisk represents a disk created on the cluster level
          +optional
      memoryDump:
        allOf:
        - $ref: '#/definitions/v1.MemoryDumpVolumeSource'
        description: MemoryDump is attached to the virt launcher and is populated
          with a memory dump of the vmi
      name:
        description: |-
          Volume's name.
          Must be a DNS_LABEL and unique within the vmi.
          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
        type: string
      persistentVolumeClaim:
        allOf:
        - $ref: '#/definitions/kubevirt_io_api_core_v1.PersistentVolumeClaimVolumeSource'
        description: |-
          PersistentVolumeClaimVolumeSource represents a reference to a PersistentVolumeClaim in the same namespace.
          Directly attached to the vmi via qemu.
          More info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#persistentvolumeclaims
          +optional
      secret:
        allOf:
        - $ref: '#/definitions/kubevirt_io_api_core_v1.SecretVolumeSource'
        description: |-
          SecretVolumeSource represents a reference to a secret data in the same namespace.
          More info: https://kubernetes.io/docs/concepts/configuration/secret/
          +optional
      serviceAccount:
        allOf:
        - $ref: '#/definitions/v1.ServiceAccountVolumeSource'
        description: |-
          ServiceAccountVolumeSource represents a reference to a service account.
          There can only be one volume of this type!
          More info: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
          +optional
      sysprep:
        allOf:
        - $ref: '#/definitions/v1.SysprepSource'
        description: |-
          Represents a Sysprep volume source.
          +optional
    type: object
