          UTC sets the guest clock to UTC on each boot. If an offset is specified,
          guest changes to the clock will be kept during reboots and are not reset.
    type: object
  v1.ClockOffsetUTC:
    properties:
      offsetSeconds:
        description: |-
          OffsetSeconds specifies an offset in seconds, relative to UTC. If set,
          guest changes to the clock will be kept during reboots and not reset.
        type: integer
    type: object
  v1.CloudInitConfigDriveSource:
    properties:
      networkData:
        description: |-
          NetworkData contains config drive inline cloud-init networkdata.
          + optional
        type: string
      networkDataBase64:
        description: |-
          NetworkDataBase64 contains config drive cloud-init networkdata as a base64 encoded string.
          + optional
        type: string
      networkDataSecretRef:
        allOf:
        - $ref: '#/definitions/v1.LocalObjectReference'
        description: |-
          NetworkDataSecretRef references a k8s secret that contains config drive networkdata.
          + optional
      secretRef:
        allOf:
        - $ref: '#/definitions/v1.LocalObjectReference'
        description: |-
          UserDataSecretRef references a k8s secret that contains config drive userdata.
          + optional
      userData:
        description: |-
          UserData contains config drive inline cloud-init userdata.
          + optional
        type: string
      userDataBase64:
        description: |-
          UserDataBase64 contains config drive cloud-init userdata as a base64 encoded string.
          + optional
        type: string
    type: object
  v1.CloudInitNoCloudSource:
    properties:
      networkData:
        description: |-
          NetworkData contains NoCloud inline cloud-init networkdata.
          + optional
        type: string
      networkDataBase64:
        description: |-
          NetworkDataBase64 contains NoCloud cloud-init networkdata as a base64 encoded string.
          + optional
        type: string
      networkDataSecretRef:
        allOf:
        - $ref: '#/definitions/v1.LocalObjectReference'
        description: |-
          NetworkDataSecretRef references a k8s secret that contains NoCloud networkdata.
          + optional
      secretRef:
        allOf:
        - $ref: '#/definitions/v1.LocalObjectReference'
        description: |-
          UserDataSecretRef references a k8s secret that contains NoCloud userdata.
          + optional
      userData:
        description: |-
          UserData contains NoCloud inline cloud-init userdata.
          + optional
        type: string
      userDataBase64:
        description: |-
          UserDataBase64 contains NoCloud cloud-init userdata as a base64 encoded string.
          + optional
        type: string
    type: object
  v1.ConfigDriveSSHPublicKeyAccessCredentialPropagation:
    type: object
  v1.ContainerDiskInfo:
    properties:
      checksum:
        description: Checksum is the checksum of the rootdisk or kernel artifacts
          inside the containerdisk
        type: integer
    type: object
  v1.ContainerDiskSource:
    properties:
      image:
        description: Image is the name of the image with the embedded disk.
        type: string
      imagePullPolicy:
        allOf:
        - $ref: '#/definitions/v1.PullPolicy'
        description: |-
          Image pull policy.
          One of Always, Never, IfNotPresent.
          Defaults to Always if :latest tag is specified, or IfNotPresent otherwise.
          Cannot be updated.
          More info: https://kubernetes.io/docs/concepts/containers/images#updating-images
          +optional
      imagePullSecret:
        description: ImagePullSecret is the name of the Docker registry secret required
          to pull the image. The secret must already exist.
        type: string
      path:
        description: Path defines the path to disk file in the container
        type: string
    type: object
  v1.CustomBlockSize:
    properties:
      discardGranularity:
        type: integer
      logical:
        type: integer
      physical:
        type: integer
    type: object
  v1.DHCPOptions:
    properties:
      bootFileName:
        description: |-
          If specified will pass option 67 to interface's DHCP server
          +optional
        type: string
      ntpServers:
        description: |-
          If specified will pass the configured NTP server to the VM via DHCP option 042.
          +optional
        items:
          type: string
        type: array
      privateOptions:
        description: |-
          If specified will pass extra DHCP options for private use, range: 224-254
          +optional
        items:
          $ref: '#/definitions/v1.DHCPPrivateOptions'
        type: array
      tftpServerName:
        description: |-
          If specified will pass option 66 to interface's DHCP server
          +optional
        type: string
    type: object
  v1.DHCPPrivateOptions:
    properties:
      option:
        description: |-
          Option is an Integer value from 224-254
          Required.
        type: integer
      value:
        description: |-
          Value is a String value for the Option provided
          Required.
        type: string
    type: object
  v1.DataVolumeSource:
    properties:
      hotpluggable:
        description: |-
          Hotpluggable indicates whether the volume can be hotplugged and hotunplugged.
          +optional
        type: boolean
      name:
        description: Name of both the DataVolume and the PVC in the same namespace.
        type: string
    type: object
  v1.DeprecatedInterfaceMacvtap:
    type: object
  v1.DeprecatedInterfacePasst:
    type: object
  v1.DeprecatedInterfaceSlirp:
    type: object
  v1.Devices:
    properties:
      autoattachGraphicsDevice:
        description: |-
          Whether to attach the default graphics device or not.
          VNC will not be available if set to false. Defaults to true.
        type: boolean
      autoattachInputDevice:
        description: |-
          Whether to attach an Input Device.
          Defaults to false.
          +optional
        type: boolean
      autoattachMemBalloon:
        description: |-
          Whether to attach the Memory balloon device with default period.
          Period can be adjusted in virt-config.
          Defaults to true.
          +optional
        type: boolean
      autoattachPodInterface:
        description: Whether to attach a pod network interface. Defaults to true.
        type: boolean
      autoattachSerialConsole:
        description: |-
          Whether to attach the default virtio-serial console or not.
          Serial console access will not be available if set to false. Defaults to true.
        type: boolean
      autoattachVSOCK:
        description: |-
          Whether to attach the VSOCK CID to the VM or not.
          VSOCK access will be available if set to true. Defaults to false.
        type: boolean
      blockMultiQueue:
        description: |-
          Whether or not to enable virtio multi-queue for block devices.
          Defaults to false.
          +optional
        type: boolean
      clientPassthrough:
        allOf:
        - $ref: '#/definitions/v1.ClientPassthroughDevices'
        description: |-
          To configure and access client devices such as redirecting USB
          +optional
      disableHotplug:
        description: DisableHotplug disabled the ability to hotplug disks.
        type: boolean
      disks:
        description: |-
          Disks describes disks, cdroms and luns which are connected to the vmi.
          +kubebuilder:validation:MaxItems:=256
        items:
          $ref: '#/definitions/v1.Disk'
        type: array
      downwardMetrics:
        allOf:
        - $ref: '#/definitions/v1.DownwardMetrics'
        description: |-
          DownwardMetrics creates a virtio serials for exposing the downward metrics to the vmi.
          +optional
      filesystems:
        description: |-
          Filesystems describes filesystem which is connected to the vmi.
          +optional
          +listType=atomic
        items:
          $ref: '#/definitions/v1.Filesystem'
        type: array
      gpus:
        description: |-
          Whether to attach a GPU device to the vmi.
          +optional
          +listType=atomic
        items:
          $ref: '#/definitions/v1.GPU'
        type: array
      hostDevices:
        description: |-
          Whether to attach a host device to the vmi.
          +optional
          +listType=atomic
        items:
          $ref: '#/definitions/v1.HostDevice'
        type: array
      inputs:
        description: Inputs describe input devices
        items:
          $ref: '#/definitions/v1.Input'
        type: array
      interfaces:
        description: |-
          Interfaces describe network interfaces which are added to the vmi.
          +kubebuilder:validation:MaxItems:=256
        items:
          $ref: '#/definitions/kubevirt_io_api_core_v1.Interface'
        type: array
      logSerialConsole:
        description: |-
          Whether to log the auto-attached default serial console or not.
          Serial console logs will be collect to a file and then streamed from a named `guest-console-log`.
          Not relevant if autoattachSerialConsole is disabled.
          Defaults to cluster wide setting on VirtualMachineOptions.
        type: boolean
      networkInterfaceMultiqueue:
        description: |-
          If specified, virtual network interfaces configured with a virtio bus will also enable the vhost multiqueue feature for network devices. The number of queues created depends on additional factors of the VirtualMachineInstance, like the number of guest CPUs.
          +optional
        type: boolean
      panicDevices:
        description: |-
          PanicDevices provides additional crash information when a guest crashes.
          +optional
          +listtype=atomic
        items:
          $ref: '#/definitions/v1.PanicDevice'
        type: array
      rng:
        allOf:
        - $ref: '#/definitions/v1.Rng'
        description: |-
          Whether to have random number generator from host
          +optional
      sound:
        allOf:
        - $ref: '#/definitions/v1.SoundDevice'
        description: |-
          Whether to emulate a sound device.
          +optional
      tpm:
        allOf:
        - $ref: '#/definitions/v1.TPMDevice'
        description: |-
          Whether to emulate a TPM device.
          +optional
      useVirtioTransitional:
        description: |-
          Fall back to legacy virtio 0.9 support if virtio bus is selected on devices.
          This is helpful for old machines like CentOS6 or RHEL6 which
          do not understand virtio_non_transitional (virtio 1.0).
        type: boolean
      video:
        allOf:
        - $ref: '#/definitions/v1.VideoDevice'
        description: |-
          Video describes the video device configuration for the vmi.
          +optional
      watchdog:
        allOf:
        - $ref: '#/definitions/v1.Watchdog'
        description: Watchdog describes a watchdog device which can be added to the
          vmi.
    type: object
  v1.Diag288Watchdog:
    properties:
      action:
        allOf:
        - $ref: '#/definitions/v1.WatchdogAction'
        description: |-
          The action to take. Valid values are poweroff, reset, shutdown.
          Defaults to reset.
    type: object
  v1.Disk:
    properties:
      blockSize:
        allOf:
        - $ref: '#/definitions/v1.BlockSize'
        description: |-
          If specified, the virtual disk will be presented with the given block sizes.
          +optional
      bootOrder:
        description: |-
          BootOrder is an integer value > 0, used to determine ordering of boot devices.
          Lower values take precedence.
          Each disk or interface that has a boot order must have a unique value.
          Disks without a boot order are not tried if a disk with a boot order exists.
          +optional
        type: integer
      cache:
        allOf:
        - $ref: '#/definitions/v1.DriverCache'
        description: |-
          Cache specifies which kvm disk cache mode should be used.
          Supported values are:
          none: Guest I/O not cached on the host, but may be kept in a disk cache.
          writethrough: Guest I/O cached on the host but written through to the physical medium. Slowest but with most guarantees.
          writeback: Guest I/O cached on the host.
          Defaults to none if the storage supports O_DIRECT, otherwise writethrough.
          +optional
      cdrom:
        allOf:
        - $ref: '#/definitions/v1.CDRomTarget'
        description: Attach a volume as a cdrom to the vmi.
      changedBlockTracking:
        description: |-
          ChangedBlockTracking indicates this disk should have CBT option
          Defaults to false.
          +optional
        type: boolean
      dedicatedIOThread:
        description: |-
          dedicatedIOThread indicates this disk should have an exclusive IO Thread.
          Enabling this implies useIOThreads = true.
          Defaults to false.
          +optional
        type: boolean
      disk:
        allOf:
        - $ref: '#/definitions/v1.DiskTarget'
        description: Attach a volume as a disk to the vmi.
      errorPolicy:
        allOf:
        - $ref: '#/definitions/v1.DiskErrorPolicy'
        description: |-
          If specified, it can change the default error policy (stop) for the disk
          +optional
      io:
        allOf:
        - $ref: '#/definitions/v1.DriverIO'
        description: |-
          IO specifies which QEMU disk IO mode should be used.
          Supported values are: native, default, threads.
          +optional
      lun:
        allOf:
        - $ref: '#/definitions/v1.LunTarget'
        description: Attach a volume as a LUN to the vmi.
      name:
        description: Name is the device name
        type: string
      serial:
        description: |-
          Serial provides the ability to specify a serial number for the disk device.
          +optional
        type: string
      shareable:
        description: |-
          If specified the disk is made sharable and multiple write from different VMs are permitted
          +optional
        type: boolean
      tag:
        description: |-
          If specified, disk address and its tag will be provided to the guest via config drive metadata
          +optional
        type: string
    type: object
  v1.DiskBus:
    enum:
    - scsi
    - sata
    - virtio
    - usb
    type: string
    x-enum-varnames:
    - DiskBusSCSI
    - DiskBusSATA
    - DiskBusVirtio
    - DiskBusUSB
  v1.DiskErrorPolicy:
    enum:
    - stop
    - ignore
    - report
    - enospace
    type: string
    x-enum-varnames:
    - DiskErrorPolicyStop
    - DiskErrorPolicyIgnore
    - DiskErrorPolicyReport
    - DiskErrorPolicyEnospace
  v1.DiskIOThreads:
    properties:
      supplementalPoolThreadCount:
        description: |-
          SupplementalPoolThreadCount specifies how many iothreads are allocated for the supplementalPool policy.
          +optional
        type: integer
    type: object
  v1.DiskTarget:
    properties:
      bus:
        allOf:
        - $ref: '#/definitions/v1.DiskBus'
        description: |-
          Bus indicates the type of disk device to emulate.
          supported values: virtio, sata, scsi, usb.
      pciAddress:
        description: |-
          If specified, the virtual disk will be placed on the guests pci address with the specified PCI address. For example: 0000:81:01.10
          +optional
        type: string
      readonly:
        description: |-
          ReadOnly.
          Defaults to false.
        type: boolean
    type: object
  v1.DomainMemoryDumpInfo:
    properties:
      claimName:
        description: ClaimName is the name of the pvc the memory was dumped to
        type: string
      endTimestamp:
        description: EndTimestamp is the time when the memory dump completed
        type: string
      startTimestamp:
        description: StartTimestamp is the time when the memory dump started
        type: string
      targetFileName:
        description: TargetFileName is the name of the memory dump output
        type: string
    type: object
  v1.DomainSpec:
    properties:
      chassis:
        allOf:
        - $ref: '#/definitions/v1.Chassis'
        description: |-
          Chassis specifies the chassis info passed to the domain.
          +optional
      clock:
        allOf:
        - $ref: '#/definitions/v1.Clock'
        description: |-
          Clock sets the clock and timers of the vmi.
          +optional
      cpu:
        allOf:
        - $ref: '#/definitions/v1.CPU'
        description: |-
          CPU allow specified the detailed CPU topology inside the vmi.
          +optional
      devices:
        allOf:
        - $ref: '#/definitions/v1.Devices'
        description: Devices allows adding disks, network interfaces, and others
      features:
        allOf:
        - $ref: '#/definitions/v1.Features'
        description: |-
          Features like acpi, apic, hyperv, smm.
          +optional
      firmware:
        allOf:
        - $ref: '#/definitions/v1.Firmware'
        description: |-
          Firmware.
          +optional
      ioThreads:
        allOf:
        - $ref: '#/definitions/v1.DiskIOThreads'
        description: |-
          IOThreads specifies the IOThreads options.
          +optional
      ioThreadsPolicy:
        allOf:
        - $ref: '#/definitions/v1.IOThreadsPolicy'
        description: |-
          Controls whether or not disks will share IOThreads.
          Omitting IOThreadsPolicy disables use of IOThreads.
          One of: shared, auto, supplementalPool
          +optional
      launchSecurity:
        allOf:
        - $ref: '#/definitions/v1.LaunchSecurity'
        description: |-
          Launch Security setting of the vmi.
          +optional
      machine:
        allOf:
        - $ref: '#/definitions/v1.Machine'
        description: |-
          Machine type.
          +optional
      memory:
        allOf:
        - $ref: '#/definitions/v1.Memory'
        description: |-
          Memory allow specifying the VMI memory features.
          +optional
      resources:
        allOf:
        - $ref: '#/definitions/kubevirt_io_api_core_v1.ResourceRequirements'
        description: Resources describes the Compute Resources required by this vmi.
    type: object
  v1.DownwardAPIVolumeFile:
    properties:
      fieldRef:
        allOf:
        - $ref: '#/definitions/v1.ObjectFieldSelector'
        description: |-
          Required: Selects a field of the pod: only annotations, labels, name, namespace and uid are supported.
          +optional
      mode:
        description: |-
          Optional: mode bits used to set permissions on this file, must be an octal value
          between 0000 and 0777 or a decimal value between 0 and 511.
          YAML accepts both octal and decimal values, JSON requires decimal values for mode bits.
          If not specified, the volume defaultMode will be used.
          This might be in conflict with other options that affect the file
          mode, like fsGroup, and the result can be other mode bits set.
          +optional
        type: integer
      path:
        description: 'Required: Path is  the relative path name of the file to be
          created. Must not be absolute or contain the ''..'' path. Must be utf-8
          encoded. The first item of the relative path must not start with ''..'''
        type: string
      resourceFieldRef:
        allOf:
        - $ref: '#/definitions/v1.ResourceFieldSelector'
        description: |-
          Selects a resource of the container: only resources limits and requests
          (limits.cpu, limits.memory, requests.cpu and requests.memory) are currently supported.
          +optional
    type: object
  v1.DownwardMetrics:
    type: object
  v1.DownwardMetricsVolumeSource:
    type: object
  v1.DriverCache:
    enum:
    - none
    - writethrough
    - writeback
    type: string
    x-enum-varnames:
    - CacheNone
    - CacheWriteThrough
    - CacheWriteBack
  v1.DriverIO:
    enum:
    - threads
    - native
    type: string
    x-enum-varnames:
    - IOThreads
    - IONative
  v1.EFI:
    properties:
      persistent:
        description: |-
          If set to true, Persistent will persist the EFI NVRAM across reboots.
          Defaults to false
          +optional
        type: boolean
      secureBoot:
        description: |-
          If set, SecureBoot will be enabled and the OVMF roms will be swapped for
          SecureBoot-enabled ones.
          Requires SMM to be enabled.
          Defaults to true
          +optional
        type: boolean
    type: object
  v1.EmptyDiskSource:
    properties:
      capacity:
        allOf:
        - $ref: '#/definitions/resource.Quantity'
        description: Capacity of the sparse disk.
    type: object
  v1.EvictionStrategy:
    enum:
    - None
    - LiveMigrate
    - LiveMigrateIfPossible
    - External
    type: string
    x-enum-varnames:
    - EvictionStrategyNone
    - EvictionStrategyLiveMigrate
    - EvictionStrategyLiveMigrateIfPossible
    - EvictionStrategyExternal
  v1.ExecAction:
    properties:
      command:
        description: |-
          Command is the command line to execute inside the container, the working directory for the
          command  is root ('/') in the container's filesystem. The command is simply exec'd, it is
          not run inside a shell, so traditional shell instructions ('|', etc) won't work. To use
          a shell, you need to explicitly call out to that shell.
          Exit status of 0 is treated as live/healthy and non-zero is unhealthy.
          +optional
          +listType=atomic
        items:
          type: string
        type: array
    type: object
  v1.FeatureAPIC:
    properties:
      enabled:
        description: |-
          Enabled determines if the feature should be enabled or disabled on the guest.
          Defaults to true.
          +optional
        type: boolean
      endOfInterrupt:
        description: |-
          EndOfInterrupt enables the end of interrupt notification in the guest.
          Defaults to false.
          +optional
        type: boolean
    type: object
  v1.FeatureHyperv:
    properties:
      evmcs:
        allOf:
        - $ref: '#/definitions/v1.FeatureState'
        description: |-
          EVMCS Speeds up L2 vmexits, but disables other virtualization features. Requires vapic.
          Defaults to the machine type setting.
          +optional
      frequencies:
        allOf:
        - $ref: '#/definitions/v1.FeatureState'
        description: |-
          Frequencies improves the TSC clock source handling for Hyper-V on KVM.
          Defaults to the machine type setting.
          +optional
      ipi:
        allOf:
        - $ref: '#/definitions/v1.FeatureState'
        description: |-
          IPI improves performances in overcommited environments. Requires vpindex.
          Defaults to the machine type setting.
          +optional
      reenlightenment:
        allOf:
        - $ref: '#/definitions/v1.FeatureState'
        description: |-
          Reenlightenment enables the notifications on TSC frequency changes.
          Defaults to the machine type setting.
          +optional
      relaxed:
        allOf:
        - $ref: '#/definitions/v1.FeatureState'
        description: |-
          Relaxed instructs the guest OS to disable watchdog timeouts.
          Defaults to the machine type setting.
          +optional
      reset:
        allOf:
        - $ref: '#/definitions/v1.FeatureState'
        description: |-
          Reset enables Hyperv reboot/reset for the vmi. Requires synic.
          Defaults to the machine type setting.
          +optional
      runtime:
        allOf:
        - $ref: '#/definitions/v1.FeatureState'
        description: |-
          Runtime improves the time accounting to improve scheduling in the guest.
          Defaults to the machine type setting.
          +optional
      spinlocks:
        allOf:
        - $ref: '#/definitions/v1.FeatureSpinlocks'
        description: |-
          Spinlocks allows to configure the spinlock retry attempts.
          +optional
      synic:
        allOf:
        - $ref: '#/definitions/v1.FeatureState'
        description: |-
          SyNIC enables the Synthetic Interrupt Controller.
          Defaults to the machine type setting.
          +optional
      synictimer:
        allOf:
        - $ref: '#/definitions/v1.SyNICTimer'
        description: |-
          SyNICTimer enables Synthetic Interrupt Controller Timers, reducing CPU load.
          Defaults to the machine type setting.
          +optional
      tlbflush:
        allOf:
        - $ref: '#/definitions/v1.FeatureState'
        description: |-
          TLBFlush improves performances in overcommited environments. Requires vpindex.
          Defaults to the machine type setting.
          +optional
      vapic:
        allOf:
        - $ref: '#/definitions/v1.FeatureState'
        description: |-
          VAPIC improves the paravirtualized handling of interrupts.
          Defaults to the machine type setting.
          +optional
      vendorid:
        allOf:
        - $ref: '#/definitions/v1.FeatureVendorID'
        description: |-
          VendorID allows setting the hypervisor vendor id.
          Defaults to the machine type setting.
          +optional
      vpindex:
        allOf:
        - $ref: '#/definitions/v1.FeatureState'
        description: |-
          VPIndex enables the Virtual Processor Index to help windows identifying virtual processors.
          Defaults to the machine type setting.
          +optional
    type: object
  v1.FeatureKVM:
    properties:
      hidden:
        description: |-
          Hide the KVM hypervisor from standard MSR based discovery.
          Defaults to false
        type: boolean
    type: object
  v1.FeatureSpinlocks:
    properties:
      enabled:
        description: |-
          Enabled determines if the feature should be enabled or disabled on the guest.
          Defaults to true.
          +optional
        type: boolean
      spinlocks:
        description: |-
          Retries indicates the number of retries.
          Must be a value greater or equal 4096.
          Defaults to 4096.
          +optional
        type: integer
    type: object
  v1.FeatureState:
    properties:
      enabled:
        description: |-
          Enabled determines if the feature should be enabled or disabled on the guest.
          Defaults to true.
          +optional
        type: boolean
    type: object
  v1.FeatureVendorID:
    properties:
      enabled:
        description: |-
          Enabled determines if the feature should be enabled or disabled on the guest.
          Defaults to true.
          +optional
        type: boolean
      vendorid:
        description: |-
          VendorID sets the hypervisor vendor id, visible to the vmi.
          String up to twelve characters.
        type: string
    type: object
  v1.Features:
    properties:
      acpi:
        allOf:
        - $ref: '#/definitions/v1.FeatureState'
        description: |-
          ACPI enables/disables ACPI inside the guest.
          Defaults to enabled.
          +optional
      apic:
        allOf:
        - $ref: '#/definitions/v1.FeatureAPIC'
        description: |-
          Defaults to the machine type setting.
          +optional
      hyperv:
        allOf:
        - $ref: '#/definitions/v1.FeatureHyperv'
        description: |-
          Defaults to the machine type setting.
          +optional
      hypervPassthrough:
        allOf:
        - $ref: '#/definitions/v1.HyperVPassthrough'
        description: |-
          This enables all supported hyperv flags automatically.
          Bear in mind that if this enabled hyperV features cannot
          be enabled explicitly. In addition, a Virtual Machine
          using it will be non-migratable.
          +optional
      kvm:
        allOf:
        - $ref: '#/definitions/v1.FeatureKVM'
        description: |-
          Configure how KVM presence is exposed to the guest.
          +optional
