info:
  contact:
    email: contact@superphenix.net
    name: API Support
    url: https://superphenix.net
  description: Superphenix Controller HTTP API
  title: Superphenix Controller
  version: "0.1"
paths:
  /{orgId}/{projectId}/baas:
    get:
      description: Retrieve all baas for a project
      parameters:
      - description: Organization ID
        in: path
        name: orgId
        required: true
        type: string
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: BaaS List
          schema:
            items:
              $ref: '#/definitions/view.BaaS'
            type: array
        "500":
          description: Internal Server Error
      summary: Retrieve all baas
      tags:
      - v1
      - BaaS
  /{orgId}/{projectId}/baas/{effectiveId}:
    delete:
      description: Delete a baas by effective ID
      parameters:
      - description: Organization ID
        in: path
        name: orgId
        required: true
        type: string
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      - description: BaaS Effective ID
        in: path
        name: effectiveId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Delete a baas
      tags:
      - v1
      - BaaS
    get:
      description: Get baas by effective ID
      parameters:
      - description: Organization ID
        in: path
        name: orgId
        required: true
        type: string
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      - description: BaaS Effective ID
        in: path
        name: effectiveId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: BaaS
          schema:
            $ref: '#/definitions/view.BaaS'
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Get baas by effective ID
      tags:
      - v1
      - BaaS
  /{orgId}/{projectId}/baas/check-limit:
