  kubevirt_io_api_core_v1.ConfigMapVolumeSource:
    properties:
      name:
        description: |-
          Name of the referent.
          This field is effectively required, but due to backwards compatibility is
          allowed to be empty. Instances of this type with an empty value here are
          almost certainly wrong.
          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
          +optional
          +default=""
          +kubebuilder:default=""
          TODO: Drop `kubebuilder:default` when controller-gen doesn't need it https://github.com/kubernetes-sigs/kubebuilder/issues/3896.
        type: string
      optional:
        description: |-
          Specify whether the ConfigMap or it's keys must be defined
          +optional
        type: boolean
      volumeLabel:
        description: |-
          The volume label of the resulting disk inside the VMI.
          Different bootstrapping mechanisms require different values.
          Typical values are "cidata" (cloud-init), "config-2" (cloud-init) or "OEMDRV" (kickstart).
          +optional
        type: string
    type: object
  kubevirt_io_api_core_v1.DownwardAPIVolumeSource:
    properties:
      fields:
        description: |-
          Fields is a list of downward API volume file
          +optional
        items:
          $ref: '#/definitions/v1.DownwardAPIVolumeFile'
        type: array
      volumeLabel:
        description: |-
          The volume label of the resulting disk inside the VMI.
          Different bootstrapping mechanisms require different values.
          Typical values are "cidata" (cloud-init), "config-2" (cloud-init) or "OEMDRV" (kickstart).
