        in: path
        name: projectId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{canCreate: bool}'
          schema:
            type: object
        "500":
          description: Internal Server Error
      summary: Check all scope backup limit
      tags:
      - v1
      - BaaS
  /{orgId}/{projectId}/baas/localId/{localId}:
