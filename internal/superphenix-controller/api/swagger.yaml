        description: |-
          kind of the resource being referenced.
          kind must consist of alphanumeric characters or '-', start with an alphabetic character, and end with an alphanumeric character.
          +required
          +kubebuilder:validation:MinLength=1
          +kubebuilder:validation:MaxLength=63
          +kubebuilder:validation:Pattern=`^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$`
        type: string
      name:
        description: |-
          name of the resource being referenced.
          name must consist of lower case alphanumeric characters, '-' or '.', and must start and end with an alphanumeric character.
          +required
          +kubebuilder:validation:MinLength=1
          +kubebuilder:validation:MaxLength=253
          +kubebuilder:validation:Pattern=`^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$`
        type: string
    type: object
  v1beta2.ControlPlaneTopology:
    properties:
      deletion:
        allOf:
        - $ref: '#/definitions/v1beta2.ControlPlaneTopologyMachineDeletionSpec'
        description: |-
          deletion contains configuration options for Machine deletion.
          +optional
      healthCheck:
        allOf:
        - $ref: '#/definitions/v1beta2.ControlPlaneTopologyHealthCheck'
        description: |-
          healthCheck allows to enable, disable and override control plane health check
          configuration from the ClusterClass for this control plane.
          +optional
      metadata:
        allOf:
        - $ref: '#/definitions/v1beta2.ObjectMeta'
        description: |-
          metadata is the metadata applied to the ControlPlane and the Machines of the ControlPlane
          if the ControlPlaneTemplate referenced by the ClusterClass is machine based. If not, it
          is applied only to the ControlPlane.
          At runtime this metadata is merged with the corresponding metadata from the ClusterClass.
          +optional
      readinessGates:
        description: |-
          readinessGates specifies additional conditions to include when evaluating Machine Ready condition.

          This field can be used e.g. to instruct the machine controller to include in the computation for Machine's ready
          computation a condition, managed by an external controllers, reporting the status of special software/hardware installed on the Machine.

          If this field is not defined, readinessGates from the corresponding ControlPlaneClass will be used, if any.

          NOTE: Specific control plane provider implementations might automatically extend the list of readinessGates;
          e.g. the kubeadm control provider adds ReadinessGates for the APIServerPodHealthy, SchedulerPodHealthy conditions, etc.
          +optional
          +listType=map
          +listMapKey=conditionType
          +kubebuilder:validation:MinItems=1
          +kubebuilder:validation:MaxItems=32
        items:
          $ref: '#/definitions/v1beta2.MachineReadinessGate'
        type: array
      replicas:
        description: |-
          replicas is the number of control plane nodes.
          If the value is not set, the ControlPlane object is created without the number of Replicas
          and it's assumed that the control plane controller does not implement support for this field.
          When specified against a control plane provider that lacks support for this field, this value will be ignored.
          +optional
        type: integer
      variables:
        allOf:
        - $ref: '#/definitions/v1beta2.ControlPlaneVariables'
        description: |-
          variables can be used to customize the ControlPlane through patches.
          +optional
    type: object
  v1beta2.ControlPlaneTopologyHealthCheck:
    properties:
      checks:
        allOf:
        - $ref: '#/definitions/v1beta2.ControlPlaneTopologyHealthCheckChecks'
        description: |-
          checks are the checks that are used to evaluate if a Machine is healthy.

          If one of checks and remediation fields are set, the system assumes that an healthCheck override is defined,
          and as a consequence the checks and remediation fields from Cluster will be used instead of the
          corresponding fields in ClusterClass.

          Independent of this configuration the MachineHealthCheck controller will always
          flag Machines with `cluster.x-k8s.io/remediate-machine` annotation and
          Machines with deleted Nodes as unhealthy.

          Furthermore, if checks.nodeStartupTimeoutSeconds is not set it
          is defaulted to 10 minutes and evaluated accordingly.

          +optional
      enabled:
        description: |-
          enabled controls if a MachineHealthCheck should be created for the target machines.

          If false: No MachineHealthCheck will be created.

          If not set(default): A MachineHealthCheck will be created if it is defined here or
           in the associated ClusterClass. If no MachineHealthCheck is defined then none will be created.

          If true: A MachineHealthCheck is guaranteed to be created. Cluster validation will
          block if `enable` is true and no MachineHealthCheck definition is available.
          +optional
        type: boolean
      remediation:
        allOf:
        - $ref: '#/definitions/v1beta2.ControlPlaneTopologyHealthCheckRemediation'
        description: |-
          remediation configures if and how remediations are triggered if a Machine is unhealthy.

          If one of checks and remediation fields are set, the system assumes that an healthCheck override is defined,
          and as a consequence the checks and remediation fields from cluster will be used instead of the
          corresponding fields in ClusterClass.

          If an health check override is defined and remediation or remediation.triggerIf is not set,
          remediation will always be triggered for unhealthy Machines.

          If an health check override is defined and remediation or remediation.templateRef is not set,
          the OwnerRemediated condition will be set on unhealthy Machines to trigger remediation via
          the owner of the Machines, for example a MachineSet or a KubeadmControlPlane.

          +optional
    type: object
  v1beta2.ControlPlaneTopologyHealthCheckChecks:
    properties:
      nodeStartupTimeoutSeconds:
        description: |-
          nodeStartupTimeoutSeconds allows to set the maximum time for MachineHealthCheck
          to consider a Machine unhealthy if a corresponding Node isn't associated
          through a `Spec.ProviderID` field.

          The duration set in this field is compared to the greatest of:
          - Cluster's infrastructure ready condition timestamp (if and when available)
          - Control Plane's initialized condition timestamp (if and when available)
          - Machine's infrastructure ready condition timestamp (if and when available)
          - Machine's metadata creation timestamp

          Defaults to 10 minutes.
          If you wish to disable this feature, set the value explicitly to 0.
          +optional
          +kubebuilder:validation:Minimum=0
        type: integer
      unhealthyMachineConditions:
        description: |-
          unhealthyMachineConditions contains a list of the machine conditions that determine
          whether a machine is considered unhealthy.  The conditions are combined in a
          logical OR, i.e. if any of the conditions is met, the machine is unhealthy.

          +optional
          +listType=atomic
          +kubebuilder:validation:MinItems=1
          +kubebuilder:validation:MaxItems=100
        items:
          $ref: '#/definitions/v1beta2.UnhealthyMachineCondition'
        type: array
      unhealthyNodeConditions:
        description: |-
          unhealthyNodeConditions contains a list of conditions that determine
          whether a node is considered unhealthy. The conditions are combined in a
          logical OR, i.e. if any of the conditions is met, the node is unhealthy.

          +optional
          +listType=atomic
          +kubebuilder:validation:MinItems=1
          +kubebuilder:validation:MaxItems=100
        items:
          $ref: '#/definitions/v1beta2.UnhealthyNodeCondition'
        type: array
    type: object
  v1beta2.ControlPlaneTopologyHealthCheckRemediation:
    properties:
      templateRef:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineHealthCheckRemediationTemplateReference'
        description: |-
          templateRef is a reference to a remediation template
          provided by an infrastructure provider.

          This field is completely optional, when filled, the MachineHealthCheck controller
          creates a new object from the template referenced and hands off remediation of the machine to
          a controller that lives outside of Cluster API.
          +optional
      triggerIf:
        allOf:
        - $ref: '#/definitions/v1beta2.ControlPlaneTopologyHealthCheckRemediationTriggerIf'
        description: |-
          triggerIf configures if remediations are triggered.
          If this field is not set, remediations are always triggered.
          +optional
    type: object
  v1beta2.ControlPlaneTopologyHealthCheckRemediationTriggerIf:
    properties:
      unhealthyInRange:
        description: |-
          unhealthyInRange specifies that remediations are only triggered if the number of
          unhealthy Machines is in the configured range.
          Takes precedence over unhealthyLessThanOrEqualTo.
          Eg. "[3-5]" - This means that remediation will be allowed only when:
          (a) there are at least 3 unhealthy Machines (and)
          (b) there are at most 5 unhealthy Machines

          +optional
          +kubebuilder:validation:Pattern=^\[[0-9]+-[0-9]+\]$
          +kubebuilder:validation:MinLength=1
          +kubebuilder:validation:MaxLength=32
        type: string
      unhealthyLessThanOrEqualTo:
        allOf:
        - $ref: '#/definitions/intstr.IntOrString'
        description: |-
          unhealthyLessThanOrEqualTo specifies that remediations are only triggered if the number of
          unhealthy Machines is less than or equal to the configured value.
          unhealthyInRange takes precedence if set.

          +optional
    type: object
  v1beta2.ControlPlaneTopologyMachineDeletionSpec:
    properties:
      nodeDeletionTimeoutSeconds:
        description: |-
          nodeDeletionTimeoutSeconds defines how long the controller will attempt to delete the Node that the Machine
          hosts after the Machine is marked for deletion. A duration of 0 will retry deletion indefinitely.
          Defaults to 10 seconds.
          +optional
          +kubebuilder:validation:Minimum=0
        type: integer
      nodeDrainTimeoutSeconds:
        description: |-
          nodeDrainTimeoutSeconds is the total amount of time that the controller will spend on draining a node.
          The default value is 0, meaning that the node can be drained without any time limitations.
          NOTE: nodeDrainTimeoutSeconds is different from `kubectl drain --timeout`
          +optional
          +kubebuilder:validation:Minimum=0
        type: integer
      nodeVolumeDetachTimeoutSeconds:
        description: |-
          nodeVolumeDetachTimeoutSeconds is the total amount of time that the controller will spend on waiting for all volumes
          to be detached. The default value is 0, meaning that the volumes can be detached without any time limitations.
          +optional
          +kubebuilder:validation:Minimum=0
        type: integer
    type: object
  v1beta2.ControlPlaneVariables:
    properties:
      overrides:
        description: |-
          overrides can be used to override Cluster level variables.
          +optional
          +listType=map
          +listMapKey=name
          +kubebuilder:validation:MinItems=1
          +kubebuilder:validation:MaxItems=1000
        items:
          $ref: '#/definitions/v1beta2.ClusterVariable'
        type: array
    type: object
  v1beta2.FailureDomain:
    properties:
      attributes:
        additionalProperties:
          type: string
        description: |-
          attributes is a free form map of attributes an infrastructure provider might use or require.
          +optional
        type: object
      controlPlane:
        description: |-
          controlPlane determines if this failure domain is suitable for use by control plane machines.
          +optional
        type: boolean
      name:
        description: |-
          name is the name of the failure domain.
          +required
          +kubebuilder:validation:MinLength=1
          +kubebuilder:validation:MaxLength=256
        type: string
    type: object
  v1beta2.MachineDeletionSpec:
    properties:
      nodeDeletionTimeoutSeconds:
        description: |-
          nodeDeletionTimeoutSeconds defines how long the controller will attempt to delete the Node that the Machine
          hosts after the Machine is marked for deletion. A duration of 0 will retry deletion indefinitely.
          Defaults to 10 seconds.
          +optional
          +kubebuilder:validation:Minimum=0
        type: integer
      nodeDrainTimeoutSeconds:
        description: |-
          nodeDrainTimeoutSeconds is the total amount of time that the controller will spend on draining a node.
          The default value is 0, meaning that the node can be drained without any time limitations.
          NOTE: nodeDrainTimeoutSeconds is different from `kubectl drain --timeout`
          +optional
          +kubebuilder:validation:Minimum=0
        type: integer
      nodeVolumeDetachTimeoutSeconds:
        description: |-
          nodeVolumeDetachTimeoutSeconds is the total amount of time that the controller will spend on waiting for all volumes
          to be detached. The default value is 0, meaning that the volumes can be detached without any time limitations.
          +optional
          +kubebuilder:validation:Minimum=0
        type: integer
    type: object
  v1beta2.MachineDeployment:
    properties:
      apiVersion:
        description: |-
          APIVersion defines the versioned schema of this representation of an object.
          Servers should convert recognized schemas to the latest internal value, and
          may reject unrecognized values.
          More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
          +optional
        type: string
      kind:
        description: |-
          Kind is a string value representing the REST resource this object represents.
          Servers may infer this from the endpoint the client submits requests to.
          Cannot be updated.
          In CamelCase.
          More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
          +optional
        type: string
      metadata:
        allOf:
        - $ref: '#/definitions/v1.ObjectMeta'
        description: |-
          metadata is the standard object's metadata.
          More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata
          +optional
      spec:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineDeploymentSpec'
        description: |-
          spec is the desired state of MachineDeployment.
          +required
      status:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineDeploymentStatus'
        description: |-
          status is the observed state of MachineDeployment.
          +optional
    type: object
  v1beta2.MachineDeploymentDeletionSpec:
    properties:
      order:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineSetDeletionOrder'
        description: |-
          order defines the order in which Machines are deleted when downscaling.
          Defaults to "Random".  Valid values are "Random, "Newest", "Oldest"
          +optional
    type: object
  v1beta2.MachineDeploymentDeprecatedStatus:
    properties:
      v1beta1:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineDeploymentV1Beta1DeprecatedStatus'
        description: |-
          v1beta1 groups all the status fields that are deprecated and will be removed when support for v1beta1 will be dropped.
          +optional
    type: object
  v1beta2.MachineDeploymentRemediationSpec:
    properties:
      maxInFlight:
        allOf:
        - $ref: '#/definitions/intstr.IntOrString'
        description: |-
          maxInFlight determines how many in flight remediations should happen at the same time.

          Remediation only happens on the MachineSet with the most current revision, while
          older MachineSets (usually present during rollout operations) aren't allowed to remediate.

          Note: In general (independent of remediations), unhealthy machines are always
          prioritized during scale down operations over healthy ones.

          MaxInFlight can be set to a fixed number or a percentage.
          Example: when this is set to 20%, the MachineSet controller deletes at most 20% of
          the desired replicas.

          If not set, remediation is limited to all machines (bounded by replicas)
          under the active MachineSet's management.

          +optional
    type: object
  v1beta2.MachineDeploymentRolloutSpec:
    properties:
      after:
        description: |-
          after is a field to indicate a rollout should be performed
          after the specified time even if no changes have been made to the
          MachineDeployment.
          Example: In the YAML the time can be specified in the RFC3339 format.
          To specify the rolloutAfter target as March 9, 2023, at 9 am UTC
          use "2023-03-09T09:00:00Z".
          +optional
        type: string
      strategy:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineDeploymentRolloutStrategy'
        description: |-
          strategy specifies how to roll out control plane Machines.
          +optional
    type: object
  v1beta2.MachineDeploymentRolloutStrategy:
    properties:
      rollingUpdate:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineDeploymentRolloutStrategyRollingUpdate'
        description: |-
          rollingUpdate is the rolling update config params. Present only if
          type = RollingUpdate.
          +optional
      type:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineDeploymentRolloutStrategyType'
        description: |-
          type of rollout. Allowed values are RollingUpdate and OnDelete.
          Default is RollingUpdate.
          +required
    type: object
  v1beta2.MachineDeploymentRolloutStrategyRollingUpdate:
    properties:
      maxSurge:
        allOf:
        - $ref: '#/definitions/intstr.IntOrString'
        description: |-
          maxSurge is the maximum number of machines that can be scheduled above the
          desired number of machines.
          Value can be an absolute number (ex: 5) or a percentage of
          desired machines (ex: 10%).
          This can not be 0 if MaxUnavailable is 0.
          Absolute number is calculated from percentage by rounding up.
          Defaults to 1.
          Example: when this is set to 30%, the new MachineSet can be scaled
          up immediately when the rolling update starts, such that the total
          number of old and new machines do not exceed 130% of desired
          machines. Once old machines have been killed, new MachineSet can
          be scaled up further, ensuring that total number of machines running
          at any time during the update is at most 130% of desired machines.
          +optional
      maxUnavailable:
        allOf:
        - $ref: '#/definitions/intstr.IntOrString'
        description: |-
          maxUnavailable is the maximum number of machines that can be unavailable during the update.
          Value can be an absolute number (ex: 5) or a percentage of desired
          machines (ex: 10%).
          Absolute number is calculated from percentage by rounding down.
          This can not be 0 if MaxSurge is 0.
          Defaults to 0.
          Example: when this is set to 30%, the old MachineSet can be scaled
          down to 70% of desired machines immediately when the rolling update
          starts. Once new machines are ready, old MachineSet can be scaled
          down further, followed by scaling up the new MachineSet, ensuring
          that the total number of machines available at all times
          during the update is at least 70% of desired machines.
          +optional
    type: object
  v1beta2.MachineDeploymentRolloutStrategyType:
    enum:
    - RollingUpdate
    - OnDelete
    type: string
    x-enum-varnames:
    - RollingUpdateMachineDeploymentStrategyType
    - OnDeleteMachineDeploymentStrategyType
  v1beta2.MachineDeploymentSpec:
    properties:
      clusterName:
        description: |-
          clusterName is the name of the Cluster this object belongs to.
          +required
          +kubebuilder:validation:MinLength=1
          +kubebuilder:validation:MaxLength=63
        type: string
      deletion:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineDeploymentDeletionSpec'
        description: |-
          deletion contains configuration options for MachineDeployment deletion.
          +optional
      machineNaming:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineNamingSpec'
        description: |-
          machineNaming allows changing the naming pattern used when creating Machines.
          Note: InfraMachines & BootstrapConfigs will use the same name as the corresponding Machines.
          +optional
      paused:
        description: |-
          paused indicates that the deployment is paused.
          +optional
        type: boolean
      remediation:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineDeploymentRemediationSpec'
        description: |-
          remediation controls how unhealthy Machines are remediated.
          +optional
      replicas:
        description: |-
          replicas is the number of desired machines.
          This is a pointer to distinguish between explicit zero and not specified.

          Defaults to:
          * if the Kubernetes autoscaler min size and max size annotations are set:
            - if it's a new MachineDeployment, use min size
            - if the replicas field of the old MachineDeployment is < min size, use min size
            - if the replicas field of the old MachineDeployment is > max size, use max size
            - if the replicas field of the old MachineDeployment is in the (min size, max size) range, keep the value from the oldMD
          * otherwise use 1
          Note: Defaulting will be run whenever the replicas field is not set:
          * A new MachineDeployment is created with replicas not set.
          * On an existing MachineDeployment the replicas field was first set and is now unset.
          Those cases are especially relevant for the following Kubernetes autoscaler use cases:
          * A new MachineDeployment is created and replicas should be managed by the autoscaler
          * An existing MachineDeployment which initially wasn't controlled by the autoscaler
            should be later controlled by the autoscaler
          +optional
        type: integer
      rollout:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineDeploymentRolloutSpec'
        description: |-
          rollout allows you to configure the behaviour of rolling updates to the MachineDeployment Machines.
          It allows you to require that all Machines are replaced after a certain time,
          and allows you to define the strategy used during rolling replacements.
          +optional
      selector:
        allOf:
        - $ref: '#/definitions/v1.LabelSelector'
        description: |-
          selector is the label selector for machines. Existing MachineSets whose machines are
          selected by this will be the ones affected by this deployment.
          It must match the machine template's labels.
          +required
      template:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineTemplateSpec'
        description: |-
          template describes the machines that will be created.
          +required
    type: object
  v1beta2.MachineDeploymentStatus:
    properties:
      availableReplicas:
        description: |-
          availableReplicas is the number of available replicas for this MachineDeployment. A machine is considered available when Machine's Available condition is true.
          +optional
        type: integer
      conditions:
        description: |-
          conditions represents the observations of a MachineDeployment's current state.
          Known condition types are Available, MachinesReady, MachinesUpToDate, ScalingUp, ScalingDown, Remediating, Deleting, Paused.
          +optional
          +listType=map
          +listMapKey=type
          +kubebuilder:validation:MaxItems=32
        items:
          $ref: '#/definitions/k8s_io_apimachinery_pkg_apis_meta_v1.Condition'
        type: array
      deprecated:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineDeploymentDeprecatedStatus'
        description: |-
          deprecated groups all the status fields that are deprecated and will be removed when all the nested field are removed.
          +optional
      observedGeneration:
        description: |-
          observedGeneration is the generation observed by the deployment controller.
          +optional
          +kubebuilder:validation:Minimum=1
        type: integer
      phase:
        description: |-
          phase represents the current phase of a MachineDeployment (ScalingUp, ScalingDown, Running, Failed, or Unknown).
          +optional
          +kubebuilder:validation:Enum=ScalingUp;ScalingDown;Running;Failed;Unknown
        type: string
      readyReplicas:
        description: |-
          readyReplicas is the number of ready replicas for this MachineDeployment. A machine is considered ready when Machine's Ready condition is true.
          +optional
        type: integer
      replicas:
        description: |-
          replicas is the total number of non-terminated machines targeted by this deployment
          (their labels match the selector).
          +optional
        type: integer
      selector:
        description: |-
          selector is the same as the label selector but in the string format to avoid introspection
          by clients. The string will be in the same format as the query-param syntax.
          More info about label selectors: http://kubernetes.io/docs/user-guide/labels#label-selectors
          +optional
          +kubebuilder:validation:MinLength=1
          +kubebuilder:validation:MaxLength=4096
        type: string
      upToDateReplicas:
        description: |-
          upToDateReplicas is the number of up-to-date replicas targeted by this deployment. A machine is considered up-to-date when Machine's UpToDate condition is true.
          +optional
        type: integer
    type: object
  v1beta2.MachineDeploymentTopology:
    properties:
      class:
        description: |-
          class is the name of the MachineDeploymentClass used to create the set of worker nodes.
          This should match one of the deployment classes defined in the ClusterClass object
          mentioned in the `Cluster.Spec.Class` field.
          +required
          +kubebuilder:validation:MinLength=1
          +kubebuilder:validation:MaxLength=256
        type: string
      deletion:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineDeploymentTopologyMachineDeletionSpec'
        description: |-
          deletion contains configuration options for Machine deletion.
          +optional
      failureDomain:
        description: |-
          failureDomain is the failure domain the machines will be created in.
          Must match a key in the FailureDomains map stored on the cluster object.
          +optional
          +kubebuilder:validation:MinLength=1
          +kubebuilder:validation:MaxLength=256
        type: string
      healthCheck:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineDeploymentTopologyHealthCheck'
        description: |-
          healthCheck allows to enable, disable and override MachineDeployment health check
          configuration from the ClusterClass for this MachineDeployment.
          +optional
      metadata:
        allOf:
        - $ref: '#/definitions/v1beta2.ObjectMeta'
        description: |-
          metadata is the metadata applied to the MachineDeployment and the machines of the MachineDeployment.
          At runtime this metadata is merged with the corresponding metadata from the ClusterClass.
          +optional
      minReadySeconds:
        description: |-
          minReadySeconds is the minimum number of seconds for which a newly created machine should
          be ready.
          Defaults to 0 (machine will be considered available as soon as it
          is ready)
          +optional
          +kubebuilder:validation:Minimum=0
        type: integer
      name:
        description: |-
          name is the unique identifier for this MachineDeploymentTopology.
          The value is used with other unique identifiers to create a MachineDeployment's Name
          (e.g. cluster's name, etc). In case the name is greater than the allowed maximum length,
          the values are hashed together.
          +required
          +kubebuilder:validation:MinLength=1
          +kubebuilder:validation:MaxLength=63
          +kubebuilder:validation:Pattern=`^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$`
        type: string
      readinessGates:
        description: |-
          readinessGates specifies additional conditions to include when evaluating Machine Ready condition.

          This field can be used e.g. to instruct the machine controller to include in the computation for Machine's ready
          computation a condition, managed by an external controllers, reporting the status of special software/hardware installed on the Machine.

          If this field is not defined, readinessGates from the corresponding MachineDeploymentClass will be used, if any.

          +optional
          +listType=map
          +listMapKey=conditionType
          +kubebuilder:validation:MinItems=1
          +kubebuilder:validation:MaxItems=32
        items:
          $ref: '#/definitions/v1beta2.MachineReadinessGate'
        type: array
      replicas:
        description: |-
          replicas is the number of worker nodes belonging to this set.
          If the value is nil, the MachineDeployment is created without the number of Replicas (defaulting to 1)
          and it's assumed that an external entity (like cluster autoscaler) is responsible for the management
          of this value.
          +optional
        type: integer
      rollout:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineDeploymentTopologyRolloutSpec'
        description: |-
          rollout allows you to configure the behaviour of rolling updates to the MachineDeployment Machines.
          It allows you to define the strategy used during rolling replacements.
          +optional
      variables:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineDeploymentVariables'
        description: |-
          variables can be used to customize the MachineDeployment through patches.
          +optional
    type: object
  v1beta2.MachineDeploymentTopologyHealthCheck:
    properties:
      checks:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineDeploymentTopologyHealthCheckChecks'
        description: |-
          checks are the checks that are used to evaluate if a Machine is healthy.

          If one of checks and remediation fields are set, the system assumes that an healthCheck override is defined,
          and as a consequence the checks and remediation fields from Cluster will be used instead of the
          corresponding fields in ClusterClass.

          Independent of this configuration the MachineHealthCheck controller will always
          flag Machines with `cluster.x-k8s.io/remediate-machine` annotation and
          Machines with deleted Nodes as unhealthy.

          Furthermore, if checks.nodeStartupTimeoutSeconds is not set it
          is defaulted to 10 minutes and evaluated accordingly.

          +optional
      enabled:
        description: |-
          enabled controls if a MachineHealthCheck should be created for the target machines.

          If false: No MachineHealthCheck will be created.

          If not set(default): A MachineHealthCheck will be created if it is defined here or
           in the associated ClusterClass. If no MachineHealthCheck is defined then none will be created.

          If true: A MachineHealthCheck is guaranteed to be created. Cluster validation will
          block if `enable` is true and no MachineHealthCheck definition is available.
          +optional
        type: boolean
      remediation:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineDeploymentTopologyHealthCheckRemediation'
        description: |-
          remediation configures if and how remediations are triggered if a Machine is unhealthy.

          If one of checks and remediation fields are set, the system assumes that an healthCheck override is defined,
          and as a consequence the checks and remediation fields from cluster will be used instead of the
          corresponding fields in ClusterClass.

          If an health check override is defined and remediation or remediation.triggerIf is not set,
          remediation will always be triggered for unhealthy Machines.

          If an health check override is defined and remediation or remediation.templateRef is not set,
          the OwnerRemediated condition will be set on unhealthy Machines to trigger remediation via
          the owner of the Machines, for example a MachineSet or a KubeadmControlPlane.

          +optional
    type: object
  v1beta2.MachineDeploymentTopologyHealthCheckChecks:
    properties:
      nodeStartupTimeoutSeconds:
        description: |-
          nodeStartupTimeoutSeconds allows to set the maximum time for MachineHealthCheck
          to consider a Machine unhealthy if a corresponding Node isn't associated
          through a `Spec.ProviderID` field.

          The duration set in this field is compared to the greatest of:
          - Cluster's infrastructure ready condition timestamp (if and when available)
          - Control Plane's initialized condition timestamp (if and when available)
          - Machine's infrastructure ready condition timestamp (if and when available)
          - Machine's metadata creation timestamp

          Defaults to 10 minutes.
          If you wish to disable this feature, set the value explicitly to 0.
          +optional
          +kubebuilder:validation:Minimum=0
        type: integer
      unhealthyMachineConditions:
        description: |-
          unhealthyMachineConditions contains a list of the machine conditions that determine
          whether a machine is considered unhealthy.  The conditions are combined in a
          logical OR, i.e. if any of the conditions is met, the machine is unhealthy.

          +optional
          +listType=atomic
          +kubebuilder:validation:MinItems=1
          +kubebuilder:validation:MaxItems=100
        items:
          $ref: '#/definitions/v1beta2.UnhealthyMachineCondition'
        type: array
      unhealthyNodeConditions:
        description: |-
          unhealthyNodeConditions contains a list of conditions that determine
          whether a node is considered unhealthy. The conditions are combined in a
          logical OR, i.e. if any of the conditions is met, the node is unhealthy.

          +optional
          +listType=atomic
          +kubebuilder:validation:MinItems=1
          +kubebuilder:validation:MaxItems=100
        items:
          $ref: '#/definitions/v1beta2.UnhealthyNodeCondition'
        type: array
    type: object
  v1beta2.MachineDeploymentTopologyHealthCheckRemediation:
    properties:
      maxInFlight:
        allOf:
        - $ref: '#/definitions/intstr.IntOrString'
        description: |-
          maxInFlight determines how many in flight remediations should happen at the same time.

          Remediation only happens on the MachineSet with the most current revision, while
          older MachineSets (usually present during rollout operations) aren't allowed to remediate.

          Note: In general (independent of remediations), unhealthy machines are always
          prioritized during scale down operations over healthy ones.

          MaxInFlight can be set to a fixed number or a percentage.
          Example: when this is set to 20%, the MachineSet controller deletes at most 20% of
          the desired replicas.

          If not set, remediation is limited to all machines (bounded by replicas)
          under the active MachineSet's management.

          +optional
      templateRef:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineHealthCheckRemediationTemplateReference'
        description: |-
          templateRef is a reference to a remediation template
          provided by an infrastructure provider.

          This field is completely optional, when filled, the MachineHealthCheck controller
          creates a new object from the template referenced and hands off remediation of the machine to
          a controller that lives outside of Cluster API.
          +optional
      triggerIf:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineDeploymentTopologyHealthCheckRemediationTriggerIf'
        description: |-
          triggerIf configures if remediations are triggered.
          If this field is not set, remediations are always triggered.
          +optional
    type: object
  v1beta2.MachineDeploymentTopologyHealthCheckRemediationTriggerIf:
    properties:
      unhealthyInRange:
        description: |-
          unhealthyInRange specifies that remediations are only triggered if the number of
          unhealthy Machines is in the configured range.
          Takes precedence over unhealthyLessThanOrEqualTo.
          Eg. "[3-5]" - This means that remediation will be allowed only when:
          (a) there are at least 3 unhealthy Machines (and)
          (b) there are at most 5 unhealthy Machines

          +optional
          +kubebuilder:validation:Pattern=^\[[0-9]+-[0-9]+\]$
          +kubebuilder:validation:MinLength=1
          +kubebuilder:validation:MaxLength=32
        type: string
      unhealthyLessThanOrEqualTo:
        allOf:
        - $ref: '#/definitions/intstr.IntOrString'
        description: |-
          unhealthyLessThanOrEqualTo specifies that remediations are only triggered if the number of
          unhealthy Machines is less than or equal to the configured value.
          unhealthyInRange takes precedence if set.

          +optional
    type: object
  v1beta2.MachineDeploymentTopologyMachineDeletionSpec:
    properties:
      nodeDeletionTimeoutSeconds:
        description: |-
          nodeDeletionTimeoutSeconds defines how long the controller will attempt to delete the Node that the Machine
          hosts after the Machine is marked for deletion. A duration of 0 will retry deletion indefinitely.
          Defaults to 10 seconds.
          +optional
          +kubebuilder:validation:Minimum=0
        type: integer
      nodeDrainTimeoutSeconds:
        description: |-
          nodeDrainTimeoutSeconds is the total amount of time that the controller will spend on draining a node.
          The default value is 0, meaning that the node can be drained without any time limitations.
          NOTE: nodeDrainTimeoutSeconds is different from `kubectl drain --timeout`
          +optional
          +kubebuilder:validation:Minimum=0
        type: integer
      nodeVolumeDetachTimeoutSeconds:
        description: |-
          nodeVolumeDetachTimeoutSeconds is the total amount of time that the controller will spend on waiting for all volumes
          to be detached. The default value is 0, meaning that the volumes can be detached without any time limitations.
          +optional
          +kubebuilder:validation:Minimum=0
        type: integer
      order:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineSetDeletionOrder'
        description: |-
          order defines the order in which Machines are deleted when downscaling.
          Defaults to "Random".  Valid values are "Random, "Newest", "Oldest"
          +optional
    type: object
  v1beta2.MachineDeploymentTopologyRolloutSpec:
    properties:
      strategy:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineDeploymentTopologyRolloutStrategy'
        description: |-
          strategy specifies how to roll out control plane Machines.
          +optional
    type: object
  v1beta2.MachineDeploymentTopologyRolloutStrategy:
    properties:
      rollingUpdate:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineDeploymentTopologyRolloutStrategyRollingUpdate'
        description: |-
          rollingUpdate is the rolling update config params. Present only if
          type = RollingUpdate.
          +optional
      type:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineDeploymentRolloutStrategyType'
        description: |-
          type of rollout. Allowed values are RollingUpdate and OnDelete.
          Default is RollingUpdate.
          +required
    type: object
  v1beta2.MachineDeploymentTopologyRolloutStrategyRollingUpdate:
    properties:
      maxSurge:
        allOf:
        - $ref: '#/definitions/intstr.IntOrString'
        description: |-
          maxSurge is the maximum number of machines that can be scheduled above the
          desired number of machines.
          Value can be an absolute number (ex: 5) or a percentage of
          desired machines (ex: 10%).
          This can not be 0 if MaxUnavailable is 0.
          Absolute number is calculated from percentage by rounding up.
          Defaults to 1.
          Example: when this is set to 30%, the new MachineSet can be scaled
          up immediately when the rolling update starts, such that the total
          number of old and new machines do not exceed 130% of desired
          machines. Once old machines have been killed, new MachineSet can
          be scaled up further, ensuring that total number of machines running
          at any time during the update is at most 130% of desired machines.
          +optional
      maxUnavailable:
        allOf:
        - $ref: '#/definitions/intstr.IntOrString'
        description: |-
          maxUnavailable is the maximum number of machines that can be unavailable during the update.
          Value can be an absolute number (ex: 5) or a percentage of desired
          machines (ex: 10%).
          Absolute number is calculated from percentage by rounding down.
          This can not be 0 if MaxSurge is 0.
          Defaults to 0.
          Example: when this is set to 30%, the old MachineSet can be scaled
          down to 70% of desired machines immediately when the rolling update
          starts. Once new machines are ready, old MachineSet can be scaled
          down further, followed by scaling up the new MachineSet, ensuring
          that the total number of machines available at all times
          during the update is at least 70% of desired machines.
          +optional
    type: object
  v1beta2.MachineDeploymentV1Beta1DeprecatedStatus:
    properties:
      availableReplicas:
        description: |-
          availableReplicas is the total number of available machines (ready for at least minReadySeconds)
          targeted by this deployment.

          Deprecated: This field is deprecated and is going to be removed when support for v1beta1 will be dropped. Please see https://github.com/kubernetes-sigs/cluster-api/blob/main/docs/proposals/20240916-improve-status-in-CAPI-resources.md for more details.

          +optional
        type: integer
      conditions:
        description: |-
          conditions defines current service state of the MachineDeployment.

          Deprecated: This field is deprecated and is going to be removed when support for v1beta1 will be dropped. Please see https://github.com/kubernetes-sigs/cluster-api/blob/main/docs/proposals/20240916-improve-status-in-CAPI-resources.md for more details.

          +optional
        items:
          $ref: '#/definitions/v1beta2.Condition'
        type: array
      readyReplicas:
        description: |-
          readyReplicas is the total number of ready machines targeted by this deployment.

          Deprecated: This field is deprecated and is going to be removed when support for v1beta1 will be dropped. Please see https://github.com/kubernetes-sigs/cluster-api/blob/main/docs/proposals/20240916-improve-status-in-CAPI-resources.md for more details.

          +optional
        type: integer
      unavailableReplicas:
        description: |-
          unavailableReplicas is the total number of unavailable machines targeted by this deployment.
          This is the total number of machines that are still required for
          the deployment to have 100% available capacity. They may either
          be machines that are running but not yet available or machines
          that still have not been created.

          Deprecated: This field is deprecated and is going to be removed when support for v1beta1 will be dropped. Please see https://github.com/kubernetes-sigs/cluster-api/blob/main/docs/proposals/20240916-improve-status-in-CAPI-resources.md for more details.

          +optional
        type: integer
      updatedReplicas:
        description: |-
          updatedReplicas is the total number of non-terminated machines targeted by this deployment
          that have the desired template spec.

          Deprecated: This field is deprecated and is going to be removed when support for v1beta1 will be dropped. Please see https://github.com/kubernetes-sigs/cluster-api/blob/main/docs/proposals/20240916-improve-status-in-CAPI-resources.md for more details.

          +optional
        type: integer
    type: object
  v1beta2.MachineDeploymentVariables:
    properties:
      overrides:
        description: |-
          overrides can be used to override Cluster level variables.
          +optional
          +listType=map
          +listMapKey=name
          +kubebuilder:validation:MinItems=1
          +kubebuilder:validation:MaxItems=1000
        items:
          $ref: '#/definitions/v1beta2.ClusterVariable'
        type: array
    type: object
  v1beta2.MachineHealthCheckRemediationTemplateReference:
    properties:
      apiVersion:
        description: |-
          apiVersion of the remediation template.
          apiVersion must be fully qualified domain name followed by / and a version.
          NOTE: This field must be kept in sync with the APIVersion of the remediation template.
          +required
          +kubebuilder:validation:MinLength=1
          +kubebuilder:validation:MaxLength=317
          +kubebuilder:validation:Pattern=`^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*\/[a-z]([-a-z0-9]*[a-z0-9])?$`
        type: string
      kind:
        description: |-
          kind of the remediation template.
          kind must consist of alphanumeric characters or '-', start with an alphabetic character, and end with an alphanumeric character.
          +required
          +kubebuilder:validation:MinLength=1
          +kubebuilder:validation:MaxLength=63
          +kubebuilder:validation:Pattern=`^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$`
        type: string
      name:
        description: |-
          name of the remediation template.
          name must consist of lower case alphanumeric characters, '-' or '.', and must start and end with an alphanumeric character.
          +required
          +kubebuilder:validation:MinLength=1
          +kubebuilder:validation:MaxLength=253
          +kubebuilder:validation:Pattern=`^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$`
        type: string
    type: object
  v1beta2.MachineNamingSpec:
    properties:
      template:
        description: |-
          template defines the template to use for generating the names of the
          Machine objects.
          If not defined, it will fallback to `{{ .machineSet.name }}-{{ .random }}`.
          If the generated name string exceeds 63 characters, it will be trimmed to
          58 characters and will
          get concatenated with a random suffix of length 5.
          Length of the template string must not exceed 256 characters.
          The template allows the following variables `.cluster.name`,
          `.machineSet.name` and `.random`.
          The variable `.cluster.name` retrieves the name of the cluster object
          that owns the Machines being created.
          The variable `.machineSet.name` retrieves the name of the MachineSet
          object that owns the Machines being created.
          The variable `.random` is substituted with random alphanumeric string,
          without vowels, of length 5. This variable is required part of the
          template. If not provided, validation will fail.
          +optional
          +kubebuilder:validation:MinLength=1
          +kubebuilder:validation:MaxLength=256
        type: string
    type: object
  v1beta2.MachinePoolTopology:
    properties:
      class:
        description: |-
          class is the name of the MachinePoolClass used to create the pool of worker nodes.
          This should match one of the deployment classes defined in the ClusterClass object
          mentioned in the `Cluster.Spec.Class` field.
          +required
          +kubebuilder:validation:MinLength=1
          +kubebuilder:validation:MaxLength=256
        type: string
      deletion:
        allOf:
        - $ref: '#/definitions/v1beta2.MachinePoolTopologyMachineDeletionSpec'
        description: |-
          deletion contains configuration options for Machine deletion.
          +optional
      failureDomains:
        description: |-
          failureDomains is the list of failure domains the machine pool will be created in.
          Must match a key in the FailureDomains map stored on the cluster object.
          +optional
          +listType=atomic
          +kubebuilder:validation:MinItems=1
          +kubebuilder:validation:MaxItems=100
          +kubebuilder:validation:items:MinLength=1
          +kubebuilder:validation:items:MaxLength=256
        items:
          type: string
        type: array
      metadata:
        allOf:
        - $ref: '#/definitions/v1beta2.ObjectMeta'
        description: |-
          metadata is the metadata applied to the MachinePool.
          At runtime this metadata is merged with the corresponding metadata from the ClusterClass.
          +optional
      minReadySeconds:
        description: |-
          minReadySeconds is the minimum number of seconds for which a newly created machine pool should
          be ready.
          Defaults to 0 (machine will be considered available as soon as it
          is ready)
          +optional
          +kubebuilder:validation:Minimum=0
        type: integer
      name:
        description: |-
          name is the unique identifier for this MachinePoolTopology.
          The value is used with other unique identifiers to create a MachinePool's Name
          (e.g. cluster's name, etc). In case the name is greater than the allowed maximum length,
          the values are hashed together.
          +required
          +kubebuilder:validation:MinLength=1
          +kubebuilder:validation:MaxLength=63
          +kubebuilder:validation:Pattern=`^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$`
        type: string
      replicas:
        description: |-
          replicas is the number of nodes belonging to this pool.
          If the value is nil, the MachinePool is created without the number of Replicas (defaulting to 1)
          and it's assumed that an external entity (like cluster autoscaler) is responsible for the management
          of this value.
          +optional
        type: integer
      variables:
        allOf:
        - $ref: '#/definitions/v1beta2.MachinePoolVariables'
        description: |-
          variables can be used to customize the MachinePool through patches.
          +optional
    type: object
  v1beta2.MachinePoolTopologyMachineDeletionSpec:
    properties:
      nodeDeletionTimeoutSeconds:
        description: |-
          nodeDeletionTimeoutSeconds defines how long the controller will attempt to delete the Node that the MachinePool
          hosts after the MachinePool is marked for deletion. A duration of 0 will retry deletion indefinitely.
          Defaults to 10 seconds.
          +optional
          +kubebuilder:validation:Minimum=0
        type: integer
      nodeDrainTimeoutSeconds:
        description: |-
          nodeDrainTimeoutSeconds is the total amount of time that the controller will spend on draining a node.
          The default value is 0, meaning that the node can be drained without any time limitations.
          NOTE: nodeDrainTimeoutSeconds is different from `kubectl drain --timeout`
          +optional
          +kubebuilder:validation:Minimum=0
        type: integer
      nodeVolumeDetachTimeoutSeconds:
        description: |-
          nodeVolumeDetachTimeoutSeconds is the total amount of time that the controller will spend on waiting for all volumes
          to be detached. The default value is 0, meaning that the volumes can be detached without any time limitations.
          +optional
          +kubebuilder:validation:Minimum=0
        type: integer
    type: object
  v1beta2.MachinePoolVariables:
    properties:
      overrides:
        description: |-
          overrides can be used to override Cluster level variables.
          +optional
          +listType=map
          +listMapKey=name
          +kubebuilder:validation:MinItems=1
          +kubebuilder:validation:MaxItems=1000
        items:
          $ref: '#/definitions/v1beta2.ClusterVariable'
        type: array
    type: object
  v1beta2.MachineReadinessGate:
    properties:
      conditionType:
        description: |-
          conditionType refers to a condition with matching type in the Machine's condition list.
          If the conditions doesn't exist, it will be treated as unknown.
          Note: Both Cluster API conditions or conditions added by 3rd party controllers can be used as readiness gates.
          +required
          +kubebuilder:validation:Pattern=`^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$`
          +kubebuilder:validation:MinLength=1
          +kubebuilder:validation:MaxLength=316
        type: string
      polarity:
        allOf:
        - $ref: '#/definitions/v1beta2.ConditionPolarity'
        description: |-
          polarity of the conditionType specified in this readinessGate.
          Valid values are Positive, Negative and omitted.
          When omitted, the default behaviour will be Positive.
          A positive polarity means that the condition should report a true status under normal conditions.
          A negative polarity means that the condition should report a false status under normal conditions.
          +optional
    type: object
  v1beta2.MachineSetDeletionOrder:
    enum:
    - Random
    - Newest
    - Oldest
    type: string
    x-enum-varnames:
    - RandomMachineSetDeletionOrder
    - NewestMachineSetDeletionOrder
    - OldestMachineSetDeletionOrder
  v1beta2.MachineSpec:
    properties:
      bootstrap:
        allOf:
        - $ref: '#/definitions/v1beta2.Bootstrap'
        description: |-
          bootstrap is a reference to a local struct which encapsulates
          fields to configure the Machine’s bootstrapping mechanism.
          +required
      clusterName:
        description: |-
          clusterName is the name of the Cluster this object belongs to.
          +required
          +kubebuilder:validation:MinLength=1
          +kubebuilder:validation:MaxLength=63
        type: string
      deletion:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineDeletionSpec'
        description: |-
          deletion contains configuration options for Machine deletion.
          +optional
      failureDomain:
        description: |-
          failureDomain is the failure domain the machine will be created in.
          Must match the name of a FailureDomain from the Cluster status.
          +optional
          +kubebuilder:validation:MinLength=1
          +kubebuilder:validation:MaxLength=256
        type: string
      infrastructureRef:
        allOf:
        - $ref: '#/definitions/v1beta2.ContractVersionedObjectReference'
        description: |-
          infrastructureRef is a required reference to a custom resource
          offered by an infrastructure provider.
          +required
      minReadySeconds:
        description: |-
          minReadySeconds is the minimum number of seconds for which a Machine should be ready before considering it available.
          Defaults to 0 (Machine will be considered available as soon as the Machine is ready)
          +optional
          +kubebuilder:validation:Minimum=0
        type: integer
      providerID:
        description: |-
          providerID is the identification ID of the machine provided by the provider.
          This field must match the provider ID as seen on the node object corresponding to this machine.
          This field is required by higher level consumers of cluster-api. Example use case is cluster autoscaler
          with cluster-api as provider. Clean-up logic in the autoscaler compares machines to nodes to find out
          machines at provider which could not get registered as Kubernetes nodes. With cluster-api as a
          generic out-of-tree provider for autoscaler, this field is required by autoscaler to be
          able to have a provider view of the list of machines. Another list of nodes is queried from the k8s apiserver
          and then a comparison is done to find out unregistered machines and are marked for delete.
          This field will be set by the actuators and consumed by higher level entities like autoscaler that will
          be interfacing with cluster-api as generic provider.
          +optional
          +kubebuilder:validation:MinLength=1
          +kubebuilder:validation:MaxLength=512
        type: string
      readinessGates:
        description: |-
          readinessGates specifies additional conditions to include when evaluating Machine Ready condition.

          This field can be used e.g. by Cluster API control plane providers to extend the semantic of the
          Ready condition for the Machine they control, like the kubeadm control provider adding ReadinessGates
          for the APIServerPodHealthy, SchedulerPodHealthy conditions, etc.

          Another example are external controllers, e.g. responsible to install special software/hardware on the Machines;
          they can include the status of those components with a new condition and add this condition to ReadinessGates.

          NOTE: In case readinessGates conditions start with the APIServer, ControllerManager, Scheduler prefix, and all those
          readiness gates condition are reporting the same message, when computing the Machine's Ready condition those
          readinessGates will be replaced by a single entry reporting "Control plane components: " + message.
          This helps to improve readability of conditions bubbling up to the Machine's owner resource / to the Cluster).
          +optional
          +listType=map
          +listMapKey=conditionType
          +kubebuilder:validation:MinItems=1
          +kubebuilder:validation:MaxItems=32
        items:
          $ref: '#/definitions/v1beta2.MachineReadinessGate'
        type: array
      taints:
        description: |-
          taints are the node taints that Cluster API will manage.
          This list is not necessarily complete: other Kubernetes components may add or remove other taints from nodes,
          e.g. the node controller might add the node.kubernetes.io/not-ready taint.
          Only those taints defined in this list will be added or removed by core Cluster API controllers.

          There can be at most 64 taints.
          A pod would have to tolerate all existing taints to run on the corresponding node.

          NOTE: This list is implemented as a "map" type, meaning that individual elements can be managed by different owners.
          +optional
          +listType=map
          +listMapKey=key
          +listMapKey=effect
          +kubebuilder:validation:MinItems=1
          +kubebuilder:validation:MaxItems=64
        items:
          $ref: '#/definitions/v1beta2.MachineTaint'
        type: array
      version:
        description: |-
          version defines the desired Kubernetes version.
          This field is meant to be optionally used by bootstrap providers.
          +optional
          +kubebuilder:validation:MinLength=1
          +kubebuilder:validation:MaxLength=256
        type: string
    type: object
  v1beta2.MachineTaint:
    properties:
      effect:
        allOf:
        - $ref: '#/definitions/v1.TaintEffect'
        description: |-
          effect is the effect for the taint. Valid values are NoSchedule, PreferNoSchedule and NoExecute.
          +required
          +kubebuilder:validation:Enum=NoSchedule;PreferNoSchedule;NoExecute
      key:
        description: |-
          key is the taint key to be applied to a node.
          Must be a valid qualified name of maximum size 63 characters
          with an optional subdomain prefix of maximum size 253 characters,
          separated by a `/`.
          +required
          +kubebuilder:validation:MinLength=1
          +kubebuilder:validation:MaxLength=317
          +kubebuilder:validation:Pattern=^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*\/)?([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9]$
          +kubebuilder:validation:XValidation:rule="self.contains('/') ? ( self.split('/') [0].size() <= 253 && self.split('/') [1].size() <= 63 && self.split('/').size() == 2 ) : self.size() <= 63",message="key must be a valid qualified name of max size 63 characters with an optional subdomain prefix of max size 253 characters"
        type: string
      propagation:
        allOf:
        - $ref: '#/definitions/v1beta2.MachineTaintPropagation'
        description: |-
          propagation defines how this taint should be propagated to nodes.
          Valid values are 'Always' and 'OnInitialization'.
          Always: The taint will be continuously reconciled. If it is not set for a node, it will be added during reconciliation.
          OnInitialization: The taint will be added during node initialization. If it gets removed from the node later on it will not get added again.
          +required
      value:
        description: |-
          value is the taint value corresponding to the taint key.
          It must be a valid label value of maximum size 63 characters.
          +optional
          +kubebuilder:validation:MinLength=1
          +kubebuilder:validation:MaxLength=63
          +kubebuilder:validation:Pattern=^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$
        type: string
    type: object
