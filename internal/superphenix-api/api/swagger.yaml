  /{orgaId}/api/spx-ctrl/{az}/{projectId}/argo-link/{kind}/{effectiveId}:
    get:
      description: Returns the Argo CD UI link for a KaaS, BaaS or IaaS resource
      parameters:
      - description: Organization ID
        in: path
        name: orgaId
        required: true
        type: string
      - description: AZ Code
        in: path
        name: az
        required: true
        type: string
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      - description: Resource kind (kaas, baas, iaas)
        in: path
        name: kind
        required: true
        type: string
      - description: Effective ID of the resource
        in: path
        name: effectiveId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Argo CD Link
          schema:
            $ref: '#/definitions/argoApp.ArgoCdLinkResponse'
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      security:
      - Bearer:
        - OrganizationRead
        - ProjectArgoCdRead
      summary: Get Argo CD application link
      tags:
      - v1
      - Argo CD
