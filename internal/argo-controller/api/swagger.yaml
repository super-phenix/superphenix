basePath: /
definitions:
  argoApp.AppSource:
    properties:
      chart:
        type: string
      helm:
        $ref: '#/definitions/v1alpha1.ApplicationSourceHelm'
      path:
        type: string
      plugin:
        $ref: '#/definitions/v1alpha1.ApplicationSourcePlugin'
      repoUrl:
        type: string
      targetRevision:
        type: string
    type: object
  argoApp.CreateAppInfo:
    properties:
      general:
        properties:
          appName:
            type: string
          destination:
            type: string
        type: object
      orgID:
        type: string
      projectID:
        type: string
      resourceEffectiveID:
        type: string
      resourceLocalID:
        type: string
      spec:
        properties:
          ignoreDifferences:
            items:
              $ref: '#/definitions/v1alpha1.ResourceIgnoreDifferences'
            type: array
          source:
            $ref: '#/definitions/argoApp.AppSource'
        type: object
    type: object
  argoApp.UpdateAppInfo:
    properties:
      ignoreDifferences:
        items:
          $ref: '#/definitions/v1alpha1.ResourceIgnoreDifferences'
        type: array
      source:
        $ref: '#/definitions/argoApp.AppSource'
    type: object
  health.HealthStatusCode:
    enum:
    - Unknown
    - Progressing
    - Healthy
    - Suspended
    - Degraded
    - Missing
    type: string
    x-enum-varnames:
    - HealthStatusUnknown
    - HealthStatusProgressing
    - HealthStatusHealthy
    - HealthStatusSuspended
    - HealthStatusDegraded
    - HealthStatusMissing
  intstr.IntOrString:
    properties:
      intVal:
        type: integer
      strVal:
        type: string
      type:
        $ref: '#/definitions/intstr.Type'
    type: object
  intstr.Type:
    enum:
    - 0
    - 1
    format: int64
    type: integer
    x-enum-comments:
      Int: The IntOrString holds an int.
      String: The IntOrString holds a string.
    x-enum-descriptions:
    - The IntOrString holds an int.
    - The IntOrString holds a string.
    x-enum-varnames:
    - Int
    - String
  runtime.RawExtension:
    type: object
  v1.Operation:
    enum:
    - CREATE
    - UPDATE
    - DELETE
    - CONNECT
    type: string
    x-enum-varnames:
    - Create
    - Update
    - Delete
    - Connect
  v1.OwnerReference:
    properties:
      apiVersion:
        description: API version of the referent.
        type: string
      blockOwnerDeletion:
        description: |-
          If true, AND if the owner has the "foregroundDeletion" finalizer, then
          the owner cannot be deleted from the key-value store until this
          reference is removed.
          See https://kubernetes.io/docs/concepts/architecture/garbage-collection/#foreground-deletion
          for how the garbage collector interacts with this field and enforces the foreground deletion.
          Defaults to false.
          To set this field, a user needs "delete" permission of the owner,
          otherwise 422 (Unprocessable Entity) will be returned.
          +optional
        type: boolean
      controller:
        description: |-
          If true, this reference points to the managing controller.
          +optional
        type: boolean
      kind:
        description: |-
          Kind of the referent.
          More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
        type: string
      name:
        description: |-
          Name of the referent.
          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#names
        type: string
      uid:
        description: |-
          UID of the referent.
          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#uids
        type: string
    type: object
  v1.ResourceHealth:
    properties:
      health:
        allOf:
        - $ref: '#/definitions/v1.ResourceHealthStatus'
        description: |-
          Health of the resource.
          can be one of:
           - Healthy: operates as normal
           - Unhealthy: reported unhealthy. We consider this a temporary health issue
                        since we do not have a mechanism today to distinguish
                        temporary and permanent issues.
           - Unknown: The status cannot be determined.
                      For example, Device Plugin got unregistered and hasn't been re-registered since.

          In future we may want to introduce the PermanentlyUnhealthy Status.
      resourceID:
        description: ResourceID is the unique identifier of the resource. See the
          ResourceID type for more information.
        type: string
    type: object
  v1.ResourceHealthStatus:
    enum:
    - Healthy
    - Unhealthy
    - Unknown
    type: string
    x-enum-varnames:
    - ResourceHealthStatusHealthy
    - ResourceHealthStatusUnhealthy
    - ResourceHealthStatusUnknown
  v1.ResourceName:
    enum:
    - cpu
    - memory
    - storage
    - ephemeral-storage
    - pods
    - services
    - replicationcontrollers
    - resourcequotas
    - secrets
    - configmaps
    - persistentvolumeclaims
    - services.nodeports
    - services.loadbalancers
    - requests.cpu
    - requests.memory
    - requests.storage
    - requests.ephemeral-storage
    - limits.cpu
    - limits.memory
    - limits.ephemeral-storage
    type: string
    x-enum-varnames:
    - ResourceCPU
    - ResourceMemory
    - ResourceStorage
    - ResourceEphemeralStorage
    - ResourcePods
    - ResourceServices
    - ResourceReplicationControllers
    - ResourceQuotas
    - ResourceSecrets
    - ResourceConfigMaps
    - ResourcePersistentVolumeClaims
    - ResourceServicesNodePorts
    - ResourceServicesLoadBalancers
    - ResourceRequestsCPU
    - ResourceRequestsMemory
    - ResourceRequestsStorage
    - ResourceRequestsEphemeralStorage
    - ResourceLimitsCPU
    - ResourceLimitsMemory
    - ResourceLimitsEphemeralStorage
  v1.ResourceStatus:
    properties:
      name:
        allOf:
        - $ref: '#/definitions/v1.ResourceName'
        description: |-
          Name of the resource. Must be unique within the pod and in case of non-DRA resource, match one of the resources from the pod spec.
          For DRA resources, the value must be "claim:<claim_name>/<request>".
          When this status is reported about a container, the "claim_name" and "request" must match one of the claims of this container.
          +required
      resources:
        description: |-
          List of unique resources health. Each element in the list contains an unique resource ID and its health.
          At a minimum, for the lifetime of a Pod, resource ID must uniquely identify the resource allocated to the Pod on the Node.
          If other Pod on the same Node reports the status with the same resource ID, it must be the same resource they share.
          See ResourceID type definition for a specific format it has in various use cases.
          +listType=map
          +listMapKey=resourceID
        items:
          $ref: '#/definitions/v1.ResourceHealth'
        type: array
    type: object
  v1alpha1.AppHealthStatus:
    properties:
      lastTransitionTime:
        description: LastTransitionTime is the time the HealthStatus was set or updated
        type: string
      message:
        description: |-
          Message is a human-readable informational message describing the health status

          Deprecated: this field is not used and will be removed in a future release.
        type: string
      status:
        allOf:
        - $ref: '#/definitions/health.HealthStatusCode'
        description: Status holds the status code of the application
    type: object
  v1alpha1.ApplicationCondition:
    properties:
      lastTransitionTime:
        description: LastTransitionTime is the time the condition was last observed
        type: string
      message:
        description: Message contains human-readable message indicating details about
          condition
        type: string
      type:
        description: Type is an application condition type
        type: string
    type: object
  v1alpha1.ApplicationDestination:
    properties:
      name:
        description: Name is an alternate way of specifying the target cluster by
          its symbolic name. This must be set if Server is not set.
        type: string
      namespace:
        description: |-
          Namespace specifies the target namespace for the application's resources.
          The namespace will only be set for namespace-scoped resources that have not set a value for .metadata.namespace
        type: string
      server:
        description: Server specifies the URL of the target cluster's Kubernetes control
          plane API. This must be set if Name is not set.
        type: string
    type: object
  v1alpha1.ApplicationSource:
    properties:
      chart:
        description: Chart is a Helm chart name, and must be specified for applications
          sourced from a Helm repo.
        type: string
      directory:
        allOf:
        - $ref: '#/definitions/v1alpha1.ApplicationSourceDirectory'
        description: Directory holds path/directory specific options
      helm:
        allOf:
        - $ref: '#/definitions/v1alpha1.ApplicationSourceHelm'
        description: Helm holds helm specific options
      kustomize:
        allOf:
        - $ref: '#/definitions/v1alpha1.ApplicationSourceKustomize'
        description: Kustomize holds kustomize specific options
      name:
        description: Name is used to refer to a source and is displayed in the UI.
          It is used in multi-source Applications.
        type: string
      path:
        description: Path is a directory path within the Git repository, and is only
          valid for applications sourced from Git.
        type: string
      plugin:
        allOf:
        - $ref: '#/definitions/v1alpha1.ApplicationSourcePlugin'
        description: Plugin holds config management plugin specific options
      ref:
        description: Ref is reference to another source within sources field. This
          field will not be used if used with a `source` tag.
        type: string
      repoURL:
        description: RepoURL is the URL to the repository (Git or Helm) that contains
          the application manifests
        type: string
      targetRevision:
        description: |-
          TargetRevision defines the revision of the source to sync the application to.
          In case of Git, this can be commit, tag, or branch. If omitted, will equal to HEAD.
          In case of Helm, this is a semver tag for the Chart's version.
        type: string
    type: object
  v1alpha1.ApplicationSourceDirectory:
    properties:
      exclude:
        description: Exclude contains a glob pattern to match paths against that should
          be explicitly excluded from being used during manifest generation
        type: string
      include:
        description: Include contains a glob pattern to match paths against that should
          be explicitly included during manifest generation
        type: string
      jsonnet:
        allOf:
        - $ref: '#/definitions/v1alpha1.ApplicationSourceJsonnet'
        description: Jsonnet holds options specific to Jsonnet
      recurse:
        description: Recurse specifies whether to scan a directory recursively for
          manifests
        type: boolean
    type: object
  v1alpha1.ApplicationSourceHelm:
    properties:
      apiVersions:
        description: |-
          APIVersions specifies the Kubernetes resource API versions to pass to Helm when templating manifests. By default,
          Argo CD uses the API versions of the target cluster. The format is [group/]version/kind.
        items:
          type: string
        type: array
      fileParameters:
        description: FileParameters are file parameters to the helm template
        items:
          $ref: '#/definitions/v1alpha1.HelmFileParameter'
        type: array
      ignoreMissingValueFiles:
        description: IgnoreMissingValueFiles prevents helm template from failing when
          valueFiles do not exist locally by not appending them to helm template --values
        type: boolean
      kubeVersion:
        description: |-
          KubeVersion specifies the Kubernetes API version to pass to Helm when templating manifests. By default, Argo CD
          uses the Kubernetes version of the target cluster.
        type: string
      namespace:
        description: Namespace is an optional namespace to template with. If left
          empty, defaults to the app's destination namespace.
        type: string
      parameters:
        description: Parameters is a list of Helm parameters which are passed to the
          helm template command upon manifest generation
        items:
          $ref: '#/definitions/v1alpha1.HelmParameter'
        type: array
      passCredentials:
        description: PassCredentials pass credentials to all domains (Helm's --pass-credentials)
        type: boolean
      releaseName:
        description: ReleaseName is the Helm release name to use. If omitted it will
          use the application name
        type: string
      skipCrds:
        description: SkipCrds skips custom resource definition installation step (Helm's
          --skip-crds)
        type: boolean
      skipSchemaValidation:
        description: SkipSchemaValidation skips JSON schema validation (Helm's --skip-schema-validation)
        type: boolean
      skipTests:
        description: SkipTests skips test manifest installation step (Helm's --skip-tests).
        type: boolean
      valueFiles:
        description: ValuesFiles is a list of Helm value files to use when generating
          a template
        items:
          type: string
        type: array
      values:
        description: |-
          Values specifies Helm values to be passed to helm template, typically defined as a block. ValuesObject takes precedence over Values, so use one or the other.
          +patchStrategy=replace
        type: string
      valuesObject:
        allOf:
        - $ref: '#/definitions/runtime.RawExtension'
        description: |-
          ValuesObject specifies Helm values to be passed to helm template, defined as a map. This takes precedence over Values.
          +kubebuilder:pruning:PreserveUnknownFields
      version:
        description: Version is the Helm version to use for templating ("3")
        type: string
    type: object
  v1alpha1.ApplicationSourceJsonnet:
    properties:
      extVars:
        description: ExtVars is a list of Jsonnet External Variables
        items:
          $ref: '#/definitions/v1alpha1.JsonnetVar'
        type: array
      libs:
        description: Additional library search dirs
        items:
          type: string
        type: array
      tlas:
        description: TLAS is a list of Jsonnet Top-level Arguments
        items:
          $ref: '#/definitions/v1alpha1.JsonnetVar'
        type: array
    type: object
  v1alpha1.ApplicationSourceKustomize:
    properties:
      apiVersions:
        description: |-
          APIVersions specifies the Kubernetes resource API versions to pass to Helm when templating manifests. By default,
          Argo CD uses the API versions of the target cluster. The format is [group/]version/kind.
        items:
          type: string
        type: array
      commonAnnotations:
        additionalProperties:
          type: string
        description: CommonAnnotations is a list of additional annotations to add
          to rendered manifests
        type: object
      commonAnnotationsEnvsubst:
        description: CommonAnnotationsEnvsubst specifies whether to apply env variables
          substitution for annotation values
        type: boolean
      commonLabels:
        additionalProperties:
          type: string
        description: CommonLabels is a list of additional labels to add to rendered
          manifests
        type: object
      components:
        description: Components specifies a list of kustomize components to add to
          the kustomization before building
        items:
          type: string
        type: array
      forceCommonAnnotations:
        description: ForceCommonAnnotations specifies whether to force applying common
          annotations to resources for Kustomize apps
        type: boolean
      forceCommonLabels:
        description: ForceCommonLabels specifies whether to force applying common
          labels to resources for Kustomize apps
        type: boolean
      ignoreMissingComponents:
        description: IgnoreMissingComponents prevents kustomize from failing when
          components do not exist locally by not appending them to kustomization file
        type: boolean
      images:
        description: Images is a list of Kustomize image override specifications
        items:
          type: string
        type: array
      kubeVersion:
        description: |-
          KubeVersion specifies the Kubernetes API version to pass to Helm when templating manifests. By default, Argo CD
          uses the Kubernetes version of the target cluster.
        type: string
      labelIncludeTemplates:
        description: LabelIncludeTemplates specifies whether to apply common labels
          to resource templates or not
        type: boolean
      labelWithoutSelector:
        description: LabelWithoutSelector specifies whether to apply common labels
          to resource selectors or not
        type: boolean
      namePrefix:
        description: NamePrefix is a prefix appended to resources for Kustomize apps
        type: string
      nameSuffix:
        description: NameSuffix is a suffix appended to resources for Kustomize apps
        type: string
      namespace:
        description: Namespace sets the namespace that Kustomize adds to all resources
        type: string
      patches:
        description: Patches is a list of Kustomize patches
        items:
          $ref: '#/definitions/v1alpha1.KustomizePatch'
        type: array
      replicas:
        description: Replicas is a list of Kustomize Replicas override specifications
        items:
          $ref: '#/definitions/v1alpha1.KustomizeReplica'
        type: array
      version:
        description: Version controls which version of Kustomize to use for rendering
          manifests
        type: string
    type: object
  v1alpha1.ApplicationSourcePlugin:
    properties:
      env:
        items:
          $ref: '#/definitions/v1alpha1.EnvEntry'
        type: array
      name:
        type: string
      parameters:
        items:
          $ref: '#/definitions/v1alpha1.ApplicationSourcePluginParameter'
        type: array
    type: object
  v1alpha1.ApplicationSourcePluginParameter:
    properties:
      array:
        description: |-
          Array is the value of an array type parameter.
          +optional
        items:
          type: string
        type: array
      map:
        additionalProperties:
          type: string
        description: |-
          Map is the value of a map type parameter.
          +optional
        type: object
      name:
        description: Name is the name identifying a parameter.
        type: string
      string:
        description: String_ is the value of a string type parameter.
        type: string
    type: object
  v1alpha1.ComparedTo:
    properties:
      destination:
        allOf:
        - $ref: '#/definitions/v1alpha1.ApplicationDestination'
        description: Destination is a reference to the application's destination used
          for comparison
      ignoreDifferences:
        description: IgnoreDifferences is a reference to the application's ignored
          differences used for comparison
        items:
          $ref: '#/definitions/v1alpha1.ResourceIgnoreDifferences'
        type: array
      source:
        allOf:
        - $ref: '#/definitions/v1alpha1.ApplicationSource'
        description: Source is a reference to the application's source used for comparison
      sources:
        description: Sources is a reference to the application's multiple sources
          used for comparison
        items:
          $ref: '#/definitions/v1alpha1.ApplicationSource'
        type: array
    type: object
  v1alpha1.EnvEntry:
    properties:
      name:
        description: Name is the name of the variable, usually expressed in uppercase
        type: string
      value:
        description: Value is the value of the variable
        type: string
    type: object
  v1alpha1.HelmFileParameter:
    properties:
      name:
        description: Name is the name of the Helm parameter
        type: string
      path:
        description: Path is the path to the file containing the values for the Helm
          parameter
        type: string
    type: object
  v1alpha1.HelmParameter:
    properties:
      forceString:
        description: ForceString determines whether to tell Helm to interpret booleans
          and numbers as strings
        type: boolean
      name:
        description: Name is the name of the Helm parameter
        type: string
      value:
        description: Value is the value for the Helm parameter
        type: string
    type: object
  v1alpha1.JsonnetVar:
    properties:
      code:
        type: boolean
      name:
        type: string
      value:
        type: string
    type: object
  v1alpha1.KustomizePatch:
    properties:
      options:
        additionalProperties:
          type: boolean
        type: object
      patch:
        type: string
      path:
        type: string
      target:
        $ref: '#/definitions/v1alpha1.KustomizeSelector'
    type: object
  v1alpha1.KustomizeReplica:
    properties:
      count:
        allOf:
        - $ref: '#/definitions/intstr.IntOrString'
        description: Number of replicas
      name:
        description: Name of Deployment or StatefulSet
        type: string
    type: object
  v1alpha1.KustomizeSelector:
    properties:
      annotationSelector:
        type: string
      group:
        type: string
      kind:
        type: string
      labelSelector:
        type: string
      name:
        type: string
      namespace:
        type: string
      version:
        type: string
    type: object
  v1alpha1.ResourceIgnoreDifferences:
    properties:
      group:
        type: string
      jqPathExpressions:
        items:
          type: string
        type: array
      jsonPointers:
        items:
          type: string
        type: array
      kind:
        type: string
      managedFieldsManagers:
        description: |-
          ManagedFieldsManagers is a list of trusted managers. Fields mutated by those managers will take precedence over the
          desired state defined in the SCM and won't be displayed in diffs
        items:
          type: string
        type: array
      name:
        type: string
      namespace:
        type: string
    type: object
  v1alpha1.SyncStatus:
    properties:
      comparedTo:
        allOf:
        - $ref: '#/definitions/v1alpha1.ComparedTo'
        description: ComparedTo contains information about what has been compared
      revision:
        description: Revision contains information about the revision the comparison
          has been performed to
        type: string
      revisions:
        description: Revisions contains information about the revisions of multiple
          sources the comparison has been performed to
        items:
          type: string
        type: array
      status:
        allOf:
        - $ref: '#/definitions/v1alpha1.SyncStatusCode'
        description: Status is the sync state of the comparison
    type: object
  v1alpha1.SyncStatusCode:
    enum:
    - Unknown
    - Synced
    - OutOfSync
    type: string
    x-enum-varnames:
    - SyncStatusCodeUnknown
    - SyncStatusCodeSynced
    - SyncStatusCodeOutOfSync
  view.AppView:
    properties:
      apiVersion:
        description: |-
          APIVersion defines the versioned schema of this representation of an object.
          Servers should convert recognized schemas to the latest internal value, and
          may reject unrecognized values.
          More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
          +optional
        type: string
      kind:
        description: |-
          Kind is a string value representing the REST resource this object represents.
          Servers may infer this from the endpoint the client submits requests to.
          Cannot be updated.
          In CamelCase.
          More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
          +optional
        type: string
      metadata:
        $ref: '#/definitions/view.ObjectMeta'
      operation:
        $ref: '#/definitions/v1.Operation'
      spec:
        $ref: '#/definitions/view.ApplicationSpec'
      status:
        $ref: '#/definitions/view.ApplicationStatus'
    type: object
  view.Application:
    properties:
      app:
        $ref: '#/definitions/view.AppView'
      codeAZ:
        type: string
      eid:
        description: effective ID
        type: string
      gitops:
        type: string
      id:
        description: local ID
        type: string
      resourceName:
        description: human-readable name
        type: string
      resourceTypeId:
        type: string
    type: object
  view.ApplicationSource:
    properties:
      chart:
        description: Chart is a Helm chart name, and must be specified for applications
          sourced from a Helm repo.
        type: string
      helm:
        allOf:
        - $ref: '#/definitions/v1alpha1.ApplicationSourceHelm'
        description: Helm holds helm specific options
      name:
        description: Name is used to refer to a source and is displayed in the UI.
          It is used in multi-source Applications.
        type: string
      path:
        description: Path is a directory path within the Git repository, and is only
          valid for applications sourced from Git.
        type: string
      plugin:
        allOf:
        - $ref: '#/definitions/v1alpha1.ApplicationSourcePlugin'
        description: Plugin holds config management plugin specific options
      ref:
        description: Ref is reference to another source within sources field. This
          field will not be used if used with a `source` tag.
        type: string
      repoURL:
        description: RepoURL is the URL to the repository (Git or Helm) that contains
          the application manifests
        type: string
      targetRevision:
        description: |-
          TargetRevision defines the revision of the source to sync the application to.
          In case of Git, this can be commit, tag, or branch. If omitted, will equal to HEAD.
          In case of Helm, this is a semver tag for the Chart's version.
        type: string
    type: object
  view.ApplicationSpec:
    properties:
      source:
        allOf:
        - $ref: '#/definitions/view.ApplicationSource'
        description: Source is a reference to the location of the application's manifests
          or chart
    type: object
  view.ApplicationStatus:
    properties:
      conditions:
        description: Conditions is a list of currently observed application conditions
        items:
          $ref: '#/definitions/v1alpha1.ApplicationCondition'
        type: array
      health:
        allOf:
        - $ref: '#/definitions/v1alpha1.AppHealthStatus'
        description: Health contains information about the application's current health
          status
      resources:
        description: Resources is a list of Kubernetes resources managed by this application
        items:
          $ref: '#/definitions/v1.ResourceStatus'
        type: array
      sync:
        allOf:
        - $ref: '#/definitions/v1alpha1.SyncStatus'
        description: Sync contains information about the application's current sync
          status
    type: object
  view.ObjectMeta:
    properties:
      creationTimestamp:
        type: string
      generateName:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      namespace:
        type: string
      ownerReferences:
        items:
          $ref: '#/definitions/v1.OwnerReference'
        type: array
    type: object
info:
  contact:
    email: contact@superphenix.net
    name: API Support
    url: https://superphenix.net
  description: SPX Argo Controller HTTP API
  title: SPX Argo Controller
  version: "0.1"
paths:
  /v1/{orgId}/{projectId}/argo:
    get:
      description: List every argo apps for a project
      parameters:
      - description: Organization ID
        in: path
        name: orgId
        required: true
        type: string
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Applications
          schema:
            items:
              $ref: '#/definitions/view.Application'
            type: array
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      security:
      - Bearer:
        - ""
      summary: List Argo Apps
      tags:
      - v1
      - Argo
    post:
      description: Create an Argo App
