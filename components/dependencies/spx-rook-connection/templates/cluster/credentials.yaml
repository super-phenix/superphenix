{{- range .Values.clusters }}
{{- if and .enabled (not .local) }}
{{- $csi := .csi | default dict }}
{{- $provisionerSecretName := $csi.rbdProvisionerSecretName | default .name }}
{{- $secretNamespace := $csi.secretNamespace | default .name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $provisionerSecretName }}
  namespace: {{ $secretNamespace }}
  annotations:
    csi.rook.io/RBDProvisionerSecret: "true"
stringData:
  userID: {{ .username | quote }}
  userKey: {{ .token | quote }}
{{- end }}
{{- end }}