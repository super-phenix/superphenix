{{- range .Values.clusters }}
{{- if and .enabled (not .local) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ .name }}
  annotations:
    # Marks this Secret as the RBD provisioner secret, the same annotation Rook's own
    # create-external-cluster-resources.py / import-external-cluster.sh flow sets since v1.20.
    # Used by Rook to build the default ClientProfile's controller-publish secret reference
    # for CephBlockPoolRadosNamespace/CephFilesystemSubVolumeGroup ClientProfiles; harmless
    # for the default (non-RadosNamespace) profile this chart relies on today.
    csi.rook.io/RBDProvisionerSecret: "true"
stringData:
  userID: {{ .username | quote }}
  userKey: {{ .token | quote }}
{{- end }}
{{- end }}