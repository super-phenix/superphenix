{{- range .Values.clusters }}
{{- if and .enabled (not .local) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ .name }}
  annotations:
    csi.rook.io/RBDProvisionerSecret: "true"
stringData:
  userID: {{ .username | quote }}
  userKey: {{ .token | quote }}
{{- end }}
{{- end }}