{{- if .Values.pxeEnabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-linkaliases-setup"
  labels:
    {{- include "talos-bootstrap.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      name: "{{ .Release.Name }}-linkaliases-setup"
      labels:
        app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    spec:
      serviceAccountName: {{ .Release.Name }}-linkaliases-setup
      restartPolicy: OnFailure
      containers:
        # Injects LinkAliases into kernel cmdline arguments
        - name: "{{ .Chart.Name }}-linkaliases-setup"
          image: "{{ .Values.linkAliasesSetup.repository }}:{{ .Values.linkAliasesSetup.imageTag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CLUSTER_NAME
              value: "{{ .Values.clusterName }}"
            - name: CLUSTER_NAMESPACE
              value: "{{ .Release.Namespace }}"
{{- end }}