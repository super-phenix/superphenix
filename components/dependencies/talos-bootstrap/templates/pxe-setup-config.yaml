{{- if .Values.pxeEnabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-pxe-setup-config"
data:
  nodes-list: |
    {{- range .Values.nodes }}
    {{- if .pxeSetup }}
    - hostname: {{ .hostname }}
      ipmiIpv4: {{ .ipmiIpv4 }}
      ipmiUser: {{ .ipmiUser }}
      ipmiPassword: {{ .ipmiPassword }}
      pxeInterfaceName: {{ .pxeInterfaceName }}
      useVlan: {{ .interface.useVlan }}
    {{- end }}
    {{- end }}
{{- end }}