{{- if .Values.pxeEnabled }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: "{{ .Release.Name }}-pxe-setup-state-pv"
spec:
  claimRef:
    name: "{{ .Release.Name }}-pxe-setup-state-pvc"
    namespace: "{{ .Release.Namespace }}"
  capacity:
    storage: "{{ .Values.pxeSetup.statePvCapacity }}"
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  hostPath:
    path: "{{ .Values.pxeSetup.statePvPath }}"
{{- end }}