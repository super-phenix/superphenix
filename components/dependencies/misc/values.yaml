# -- The effective mode of the cluster.
# Passed by superphenix-system to filter objects.
effectiveMode: ""

# -- Map of object names to a list of modes.
# An object mapped to a non-empty list is only deployed if the effectiveMode is in the list.
# An object that is not in this map, or is mapped to an empty list, is deployed in every mode.
modes: {}

# -- Arbitrary YAML objects to be deployed, keyed by name.
# The objects are templated before being applied. See the example below.
objects: {}
