{{- range $localID, $db := .Values.databases }}
{{- if eq $db.location $.Values.location }}

{{- $projectID := $.Values.projectID -}}
{{- $defaults := $.Values.databaseDefaults -}}
{{- $dbID := include "sfs-dbaas.spxEID" (dict "project" $projectID "localID" $localID) }}
{{- $roles := splitList "," (include "sfs-dbaas.roles" $db) }}
{{- $lbLocalID := printf "lb.%s" $localID }}
{{- $lbID := include "sfs-dbaas.spxEID" (dict "project" $projectID "localID" $lbLocalID) }}
{{- $vip := required "Must provide a VIP for the load balancer" ($db.loadBalancer).vip }}

---
apiVersion: kubeovn.io/v1
kind: SwitchLBRule
metadata:
  name: {{ $lbID | quote }}
  labels:
    {{- include "sfs-dbaas.labels" $ | nindent 4 }}
    superphenix.net/resourceEffectiveID: {{ $lbID | quote }}
    superphenix.net/resourceLocalID: {{ $lbLocalID | quote }}
    superphenix.net/resourceName: {{ $db.name | quote }}
    superphenix.net/generated: "true"
spec:
  # Only target endpoints in the project's namespace
  namespace: {{ $.Release.Namespace | quote }}

  # Virtual IP that will respond to requests, must be part of 198.18.0.0/16 (SPX RFC008)
  {{- if not (mustRegexMatch "^198\\.18\\.(25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})\\.(25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})$" $vip) }}
  {{- fail (printf "Load balancer VIP %s must be part of 198.18.0.0/16" $vip) }}
  {{- end }}
  vip: {{ $vip | quote }}

  # One port per CloudNative-PG service, same port on the proxies
  ports:
  {{- range $role := $roles }}
  {{- $port := get $defaults.proxy.ports $role }}
  - name: {{ printf "%d-%d-tcp" (int $port) (int $port) }}
    port: {{ $port }}
    targetPort: {{ $port }}
    protocol: "TCP"
  {{- end }}

  # Proxies in the customer subnet, they follow the instances through the CloudNative-PG services
  selector:
  - {{ printf "superphenix.net/resourceEffectiveID:%s" $dbID | quote }}
  - "superphenix.net/workloadClass:dbaas-proxy"

{{- end }}
{{- end }}
