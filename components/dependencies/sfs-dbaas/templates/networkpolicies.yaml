{{- range $localID, $db := .Values.databases }}
{{- if eq $db.location $.Values.location }}

{{- $projectID := $.Values.projectID -}}
{{- $defaults := $.Values.databaseDefaults -}}
{{- $dbID := include "sfs-dbaas.spxEID" (dict "project" $projectID "localID" $localID) }}
{{- $netpolLocalID := printf "internal.%s" $localID }}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-internal-{{ $dbID }}
  annotations:
    ovn.kubernetes.io/network_policy_enforcement: lax
  labels:
    {{- include "sfs-dbaas.labels" $ | nindent 4 }}
    superphenix.net/resourceEffectiveID: {{ $dbID | quote }}
    superphenix.net/resourceLocalID: {{ $netpolLocalID | quote }}
    superphenix.net/resourceName: {{ $netpolLocalID | quote }}
    superphenix.net/generated: "true"
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ $dbID | quote }}
  policyTypes:
  - Ingress
  ingress:
  # Operator to instance manager
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ $defaults.operatorNamespace | quote }}
    ports:
    - port: {{ $defaults.statusPort }}
  # Replication between instances
  - from:
    - podSelector:
        matchLabels:
          cnpg.io/cluster: {{ $dbID | quote }}
    ports:
    - port: {{ $defaults.port }}
    - port: {{ $defaults.statusPort }}
  # Proxies exposing the database on the customer subnet
  - from:
    - podSelector:
        matchLabels:
          superphenix.net/resourceEffectiveID: {{ $dbID | quote }}
          superphenix.net/workloadClass: dbaas-proxy
    ports:
    - port: {{ $defaults.port }}

{{- $proxyNetpolLocalID := printf "proxy.%s" $localID }}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-proxy-{{ $dbID }}
  annotations:
    ovn.kubernetes.io/network_policy_enforcement: lax
  labels:
    {{- include "sfs-dbaas.labels" $ | nindent 4 }}
    superphenix.net/resourceEffectiveID: {{ $dbID | quote }}
    superphenix.net/resourceLocalID: {{ $proxyNetpolLocalID | quote }}
    superphenix.net/resourceName: {{ $proxyNetpolLocalID | quote }}
    superphenix.net/generated: "true"
spec:
  podSelector:
    matchLabels:
      superphenix.net/resourceEffectiveID: {{ $dbID | quote }}
      superphenix.net/workloadClass: dbaas-proxy
  policyTypes:
  - Ingress
  - Egress
  # Security groups targeting the proxies open client access
  ingress: []
  # Matched on pod IPs after service DNAT, applies alongside security group egress rules
  egress:
  # Instances behind the CloudNative-PG services
  - to:
    - podSelector:
        matchLabels:
          cnpg.io/cluster: {{ $dbID | quote }}
    ports:
    - port: {{ $defaults.port }}
      protocol: TCP
  # Cluster DNS
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ $defaults.proxy.dnsNamespace | quote }}
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  {{- if ($db.loadBalancer).enabled }}
  # Replies to the OVN health checks, sent from an address in the subnet
  # TODO: allo w a single health-check IP reserved per subnet instead of the whole CIDR
  - to:
    {{- range $cidr := splitList "," (required "Must provide the subnet CIDR" $db.subnetCIDR) }}
    - ipBlock:
        cidr: {{ trim $cidr | quote }}
    {{- end }}
  {{- end }}

{{- end }}
{{- end }}
