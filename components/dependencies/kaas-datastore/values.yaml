#  # -- AZ in which the datastores are deployed
location: ""

# -- Defines default values for datastores
# @section -- Datastore default parameters
dataStoreDefaults:
  replicas: 3
  storage: 10Gi

# -- Defines datastore resources for the controlplanes.
# Each key defines a datastore and should be unique
# See values.yaml for the complete syntax.
# @default -- {}
dataStores: {}
