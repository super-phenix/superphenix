  #       # @default -- default
  #       defaultPolicies: default
    
  #       # -- FQDN to join the controlplane on
  #       # @section -- Controlplane network
  #       fqdn: ""
  
  #   # -- Worker node specification
  #   # @section -- Cluster
  #   # @default -- {}
  #   workers:
  #     network:

  #       # -- Worker networkpolicy to apply, one of [default, strict, none]
  #       # @section -- Worker network
  #       # @default -- default
  #       defaultPolicies: default

  #     # -- Each key defines a new worker VM pool to be deployed.
  #     # Each key should be unique.
