  #       dedicated: false

  #       # -- (Optional) Datastore's friendly name if using a default one (dedicated = false).
  #       # Automatically configured if empty.
  #       # Format: 'spx-<region>-<az>-virt01-datastore0X'.
  #       # @section -- Datastore
  #       name: ""

  #       # Storage class friendly name to use when 'dedicated = true'
  #       # @section -- Datastore
  #       storageClassName: default
  
  #       # -- Size of the persistentVolumeClaims when 'dedicated = true'
  #       # @section -- Datastore
  #       storage: 8Gi
  
  #       # -- Version tag of the etcd image when 'dedicated = true'
