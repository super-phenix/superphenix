# -- Superphénix organization to which this project belongs, must be a generated UUIDv4.
# This ID must come from the SPX API, this parameter cannot be overriden by the user.
# @section -- Organization parameters
organizationID: "00000000-0000-0000-0000-000000000000"
# -- Superphénix organization's friendly name.
# This parameter cannot be overriden by the user.
# @section -- Organization parameters
organizationName: "null"

# -- Superphénix project to which this project belongs, must be a project within the organization, must be a generated UUIDv4.
# This ID must come from the SPX API, this parameter cannot be overriden by the user.
# @section -- Organization parameters
projectID: "00000000-0000-0000-0000-000000000000"
# -- Superphénix project's friendly name.
# This ID must come from the SPX API, this parameter cannot be overriden by the user.
# @section -- Organization parameters
projectName: "null"

# -- AZ in which we're deploying this chart.
# This parameter cannot be overriden by the user.
location: ""

# -- Whether this chart is deployed through GitOps or not
# This parameter cannot be overriden by the user.
gitops: false

# -- Domain to use in generated urls (controlplanes, AZ IPs)
# This parameter cannot be overriden by the user.
domain: "superphenix.net"

# -- Domains to use in urls generated to fetch AZ IPs (per region)
# Defaults to .domain for any given region.
# This parameter cannot be overriden by the user.
azDomains: {}
  # fr01: example.org

# -- Maximum mumber of AZs in a region (for cluster migrations).
# This parameter cannot be overriden by the user.
azCount: 10

# -- Image URL for the worker VMs
# This parameter cannot be overriden by the user.
defaultImageUrl: "docker://ghcr.io/super-phenix/kaas-image"

# -- Defines default values for controlplanes and worker VMs
# Cannot be overriden by the user.
# @section -- Cluster default parameters
# @ignored
clusterDefaults:
  controlPlane:
    replicas: 3
    network:
      apiServer:
        port: 7443
        proxyPort: 7444
      konnectivity:
        port: 7442
      gatewayClass: traefik
  kaasEssentials:
    # -- Url of the chart that installs CNI and other essential components on tenant cluster
    chartUrl: "oci://ghcr.io/super-phenix/charts/kaas-essentials"

# -- Defines default values for datastores
# Cannot be overriden by the user.
# @section -- Datastore default parameters
# @ignored
dataStoreDefaults:
  replicas: 3
  version: 3.6.7 # https://quay.io/repository/coreos/etcd?tab=tags
  storage: 8Gi
  clusterDomain: "cluster.local"

# -- Defines Kubernetes clusters.
# Each key defines a new cluster and should be unique
# See values.yaml for the complete syntax.
# @default -- {}
clusters: {}
  # my-cluster:
  #   # -- User-friendly name of the cluster
  #   # @section -- Cluster
  #   name: "my-cluster"
    
  #   # -- AZ in which to deploy the resource
  #   # @section -- Cluster
