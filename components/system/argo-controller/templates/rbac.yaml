apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "argo-controller.fullname" . }}
  labels:
    {{- include "argo-controller.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
      - appprojects
    verbs:
      - get
      - update
      - patch
      - create
      - delete
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - create
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "argo-controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "argo-controller.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "argo-controller.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
