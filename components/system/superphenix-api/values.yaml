replicaCount: 1
revisionHistoryLimit: 3

image:
  repository: ghcr.io/super-phenix/superphenix-api
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Domain on which the API is exposed
domain: &apiDomain api.superphenix.net

rbac:
  # ClusterRole/Binding letting superphenix-api manage the Argo CD Applications
  # and AppProjects backing KaaS/BaaS, and create per-project namespaces.
  # Required unless the argoController features are unused.
  create: true

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount the ServiceAccount's API credentials.
  # in-cluster connection to Argo CD is built from this token.
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

containerPorts:
  http: 8080
  adminHttp: 7000
  metrics: 9090

serviceMonitor:
  enabled: true
  portName: "metrics"
  interval: 15s
  scheme: ""
  tlsConfig: {}
  bearerTokenFile: ""
  relabelings: []
  metricRelabelings: []

# Configuration values must be under `.config`
# All superphenix-api configurations are documented in `/docs/config/README.md`
#
# superphenix-api drives Argo CD directly (the standalone argo-controller is
# gone). `argoController.url` and `argoController.authSecret` no longer exist;
# the cluster connection comes from the pod ServiceAccount, so `rbac.create`
# and `serviceAccount.automount` above must stay on. Expected shape:
#
#   config:
#     argoController:
#       kubeconfig: ""                       # empty = in-cluster
#       appProjectNamespace: self-service-argocd
#       garbageCollection:
#         enabled: true                      # only one replica sweeps (advisory lock)
#         interval: 15m
#         timeout: 10m
#         labelMarkKey: superphenix.net/markedForDeletion
#         delay: 48h
#         debug: false                       # true = dry run, logs instead of deleting
#
# The KaaS/BaaS repos, kubeVersions and schedules live under
# `config.productsConfig.argoApp.{kubernetes,backup}`.
config: {}

ingress:
  enabled: true
  className: ""
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: *apiDomain
      paths:
        - path: /
  tls:
    - secretName: superphenix-api-tls
      hosts:
        - *apiDomain

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
