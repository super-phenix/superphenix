replicaCount: 1
revisionHistoryLimit: 3

image:
  repository: ghcr.io/super-phenix/superphenix-api
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Domain on which the API is exposed
domain: &apiDomain api.superphenix.net

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

containerPorts:
  http: 8080
  adminHttp: 7000
  metrics: 9090

serviceMonitor:
  enabled: true
  portName: "metrics"
  interval: 15s
  scheme: ""
  tlsConfig: {}
  bearerTokenFile: ""
  relabelings: []
  metricRelabelings: []

config: {}

ingress:
  enabled: true
  className: ""
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: *apiDomain
      paths:
        - path: /
  tls:
    - secretName: superphenix-api-tls
      hosts:
        - *apiDomain

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
