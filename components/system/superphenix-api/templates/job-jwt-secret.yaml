{{- if .Values.jwtSecret.generate -}}
{{- $secretName := .Values.jwtSecret.secretName | default (printf "%s-jwt" (include "superphenix-api.fullname" .)) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "superphenix-api.fullname" . }}-jwt-generator
  labels:
    {{- include "superphenix-api.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  template:
    metadata:
      labels:
        {{- include "superphenix-api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "superphenix-api.serviceAccountName" . }}
      restartPolicy: OnFailure
      containers:
        - name: jwt-generator
          image: bitnami/kubectl:1.31
          command:
            - /bin/bash
            - -c
            - |
              if kubectl get secret {{ $secretName }} > /dev/null 2>&1; then
                echo "Secret {{ $secretName }} already exists"
                exit 0
              fi
              echo "Generating JWT secret..."
              JWT_SECRET=$(head /dev/urandom | tr -dc A-Za-z0-9 | head -c 32)
              kubectl create secret generic {{ $secretName }} --from-literal=jwt-secret=$JWT_SECRET
{{- end }}
