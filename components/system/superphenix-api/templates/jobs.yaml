{{- if .Values.jwtSecret.generate -}}
{{- $secretName := .Values.jwtSecret.secretName | default (printf "%s-jwt" (include "superphenix-api.fullname" .)) -}}
{{- $jobName := printf "%s-jwt-gen" (include "superphenix-api.fullname" .) -}}
# The generator runs under its own service account, so the API service account
# never needs access to Secrets. The Job has a new name (it was
# <fullname>-jwt-generator) because a Job's pod template is immutable.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $jobName }}
  labels:
    {{- include "superphenix-api.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: true
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $jobName }}
  labels:
    {{- include "superphenix-api.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  # Read only the JWT secret. "create" cannot be limited by name.
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - {{ $secretName }}
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $jobName }}
  labels:
    {{- include "superphenix-api.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $jobName }}
subjects:
  - kind: ServiceAccount
    name: {{ $jobName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $jobName }}
  labels:
    {{- include "superphenix-api.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  template:
    metadata:
      labels:
        {{- include "superphenix-api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $jobName }}
      restartPolicy: OnFailure
      containers:
        - name: jwt-generator
          image: {{ .Values.jwtSecret.image.repository }}:{{ .Values.jwtSecret.image.tag }}
          command:
            - /bin/sh
            - -c
            - |
              if kubectl get secret {{ $secretName }} > /dev/null 2>&1; then
                echo "Secret {{ $secretName }} already exists"
                exit 0
              fi
              echo "Generating JWT secret..."
              JWT_SECRET=$(head /dev/urandom | tr -dc A-Za-z0-9 | head -c 32)
              kubectl create secret generic {{ $secretName }} --from-literal=jwt-secret=$JWT_SECRET
{{- end }}
