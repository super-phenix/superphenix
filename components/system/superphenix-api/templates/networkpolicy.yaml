{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "superphenix-api.fullname" . }}
  labels:
    {{- include "superphenix-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "superphenix-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # API HTTP: only the allowed callers (empty allows any caller, e.g. ingress).
    - ports:
        - port: {{ .Values.containerPorts.http }}
          protocol: TCP
      {{- with .Values.networkPolicy.allowedFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # Prometheus metrics.
    - ports:
        - port: {{ .Values.containerPorts.metrics }}
          protocol: TCP
      {{- with .Values.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
