{{- /*
Generate one Argo CD Application per entry in `.Values.apps`.

An application is deployed when:
  - `.Values.disableAll` is false, AND
  - the application is `enabled`, AND
  - the application's `modes` list is empty OR contains the current effective mode.

The effective mode is `deploymentTopology + type` (e.g. "Hyperconverged",
"DecoupledStorage", "Management", ...). See the chart README for details.
*/ -}}

{{- $cluster := .Values.cluster }}
{{- $argocd := .Values.argocd }}
{{- $labels := include "superphenix-system.labels" . }}

{{- range $app, $values := .Values.apps }}
{{- if (include "superphenix-system.shouldDeploy" (list $values $)) }}
---
apiVersion: {{ $argocd.appVersion }}
kind: Application
metadata:
  {{- /* Prefix the app name with the cluster name on non-management clusters to avoid collisions when Argo CD manages several clusters at once. */}}
  {{- $appName := $app | lower }}
  name: {{ printf "%s-%s" $cluster.name ($app | lower) }}
  namespace: {{ $argocd.namespace }}
  {{- if or $.Values.cleanupOnDeletion (default false $values.automation.cleanupOnDeletion) }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  {{- end }}
  labels:
    operator.superphenix.net/clusterName: {{ $cluster.name }}
    operator.superphenix.net/application: {{ $app | lower }}
    operator.superphenix.net/managed: "true"
    {{- include "superphenix-system.labels" $ | nindent 4 }}
  annotations:
    {{- if hasKey $values "wave" }}
    argocd.argoproj.io/sync-wave: {{ $values.wave | quote }}
    {{- end }}
spec:
  project: {{ $argocd.project }}
  source:
    repoURL: {{ $values.repoURL | quote }}

    {{- with $values.helm }}
    {{- with .chart }}
    chart: {{ . | quote }}
    {{- end }}
    {{- end }}

    {{- with $values.path }}
    path: {{ . | quote }}
    {{- end }}

    {{- with $values.directory }}
    directory:
      {{- with .recurse }}
      recurse: {{ . }}
      {{- end }}
    {{- end }}

    {{- /* Applications without an explicit targetRevision follow the chart's own version (Chart.AppVersion), which keeps every SPX component in lockstep with this chart. */}}
    targetRevision: {{ $values.targetRevision | default $.Chart.AppVersion | quote }}

    {{- if or $values.helm $values.values }}
    helm:
      {{- with $values.helm }}
      {{- with .releaseName }}
      releaseName: {{ . | quote }}
      {{- end }}
      {{- end }}

      {{- with $values.values }}
      {{- /* Run each app's values through `tpl` so they can reference other apps (e.g. share passwords or hostnames via the top-level `$` context). */}}
      valuesObject:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
    {{- end }}
  destination:
    {{- /* If the cluster is local, we target "in-cluster" instead of a remote cluster registration. */}}
    {{- $destination := $cluster.name }}
    {{- if $cluster.local }}
    {{- $destination = "in-cluster" }}
    {{- end }}
    name: {{ $destination | quote }}
    namespace: {{ $values.namespace | default $.Release.Namespace | quote }}
  {{- with $values.ignoreDifferences }}
  ignoreDifferences:
  {{- . | toYaml | nindent 4 }}
  {{- end }}
  syncPolicy:
    automated:
      {{- /* Automated sync is opt-in per app AND can be globally disabled via `.Values.forceManual`. */}}
      {{- $syncEnabled := and $values.automation.enabled (not $.Values.forceManual) | default false }}
      enabled: {{ $syncEnabled }}
      {{- if $values.automation.selfHeal }}
      selfHeal: true
      {{- end }}
      {{- if $values.automation.prune }}
      prune: true
      {{- end }}
    syncOptions:
      {{- if $values.automation.syncOptions }}
      {{- toYaml $values.automation.syncOptions | nindent 6 }}
      {{- end }}
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    managedNamespaceMetadata:
      labels:
        {{- with $values.nsLabels }}
        {{- . | toYaml | nindent 8 }}
        {{- end }}
{{- end }}
{{- end }}
