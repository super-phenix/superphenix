  # Kamaji -- Hosted k8s controlplanes
  kamaji:
    enabled: true
    wave: "10"
    modes: [Hyperconverged, DecoupledVirtualization]
    automation:
      enabled: true
      selfHeal: true
      prune: true
      cleanupOnDeletion: false
      syncOptions: {}
    namespace: "kamaji-system"
    repoURL: harbor.agc.dpk-agc-cl04.agoracalyce.net/spx-helm
    targetRevision: 26.5.7
    helm:
      chart: "kamaji"
      releaseName: "kamaji"
      values:
        image:
          tag: "26.5.2-edge" # https://github.com/clastix/kamaji/releases
        replicaCount: 3
        defaultDatastoreName: "" # Disable default DS (override in config.yaml)
        extraArgs:
          # 336h = 14d
          - --certificate-expiration-deadline=336h
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 1
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: kamaji
                  topologyKey: kubernetes.io/hostname
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 200Mi
        # dataStores are configured in each cluster's config.yaml using the etcd-operator
        kamaji-etcd:
          deploy: false

  # Cluster API operator -- Install providers for KaaS
  cluster-api-operator:
    enabled: true
    wave: "15"
    modes: [Hyperconverged, DecoupledVirtualization]
    automation:
      enabled: true
      selfHeal: true
      prune: true
      cleanupOnDeletion: false
      syncOptions: {}
    namespace: "capi-operator-system"
    repoURL: "https://kubernetes-sigs.github.io/cluster-api-operator"
    targetRevision: "0.26.0" # https://github.com/kubernetes-sigs/cluster-api-operator/releases
    helm:
      chart: "cluster-api-operator"
      releaseName: "cluster-api-operator"
      values:
        core:
          cluster-api:
            version: v1.12.7 # https://github.com/kubernetes-sigs/cluster-api/releases
        bootstrap:
