# -- Cluster on which the applications should be deployed
cluster:
  name: "in-cluster"

# -- ArgoCD application parameters
argocd:
  appVersion: "argoproj.io/v1alpha1"
  namespace: "argocd-system"
  project: "default"

# -- Disable all applications and override "per application" setting
disableAll: false

# -- Force manual sync for all applications and override "per application" setting
forceManual: false

# -- Cleanup resources on deletion (cascading deletion) for all applications and override "per application" setting
cleanupOnDeletion: false

# -- "Per application" settings
apps:
  # -- Superphenix Controller installed on the AZs
  superphenix-controller:
    enabled: true
    wave: "-10"
    modes: [Hyperconverged, DecoupledVirtualization]
    automation:
      enabled: true
      selfHeal: true
      prune: true
      cleanupOnDeletion: false
      syncOptions:
        - SkipDryRunOnMissingResource=true
    repoURL: ghcr.io/super-phenix/charts
    # Will be overridden by the chart version to achieve version parity
    targetRevision: ""
    namespace: superphenix-system
    helm:
      chart: superphenix-controller
      releaseName: superphenix-controller
      values: {}

  # -- CoreDNS used for DNS resolution within the Kubernetes clusters
  coredns:
    enabled: true
    wave: "-100"
    modes: [Hyperconverged, DecoupledStorage, DecoupledVirtualization]
    automation:
      enabled: true
      selfHeal: true
      prune: true
      cleanupOnDeletion: false
      syncOptions:
        - SkipDryRunOnMissingResource=true
    repoURL: https://coredns.github.io/helm
    targetRevision: "1.37.3"
    namespace: coredns-system
    helm:
      chart: coredns
      releaseName: coredns
      values:
        # Initial amount of DNS instances
        replicaCount: 2

        # IP of the DNS cluster-wide
        service:
          clusterIP: fd00:100:ffff::a
          clusterIPs:
            - fd00:100:ffff::a
            - 10.16.0.10
          ipFamilyPolicy: RequireDualStack

        # Monitoring for CoreDNS
        prometheus:
          service:
            enabled: true
          monitor:
            enabled: true

  # -- Kube-OVN is used as the CNI for the virtualization layer
  kubeovn:
    enabled: true
    wave: "-100"
    modes: [Hyperconverged, DecoupledVirtualization]
    automation:
      enabled: true
      selfHeal: true
      prune: true
      cleanupOnDeletion: false
      syncOptions: {}
      #  - Validate=false
    repoURL: oci://ghcr.io/kubeovn/charts/kube-ovn-v2
    targetRevision: v1.16.0
    namespace: kube-system
    helm:
      chart: kube-ovn-v2
      releaseName: kube-ovn
      values:
        # Which nodes we want to use to deploy the OVS control plane
        masterNodesLabels:
          node-role.kubernetes.io/control-plane: ""
          kube-ovn/role: null

        # IP of the nodes hosting the control plane (csv)
        masterNodes: "invalid,invalid,invalid"

        # We want to run dual-stack
        networking:
          stack: Dual
          pods:
            # By default, Kube-OVN will auto-determine the MTU to take GENEVE into account
            # If you're running a high underlay MTU, you can force the overlay MTU to 1500
            # mtu: 1500
            cidr:
              v4: "10.0.0.0/12"
              v6: "fd00:100:0000:0::/96"
            gateways:
              v4: "10.0.0.1"
              v6: "fd00:100:0000:0::1"
          services:
            cidr:
              v4: "10.16.0.0/12"
              v6: "fd00:100:ffff:0::/112"
          join:
            cidr:
              v4: "100.64.0.0/12"
              v6: "fd00:100:64::/112"

        features:
          enableNetworkPolicies: true

        natGw:
          namePrefix: "nat-gateway"

        validatingWebhook:
          enabled: true

        apiNad:
          enabled: true

        ovsOvn:
          disableModulesManagement: true
          ovsDirectory: "/var/lib/openvswitch"
          ovnDirectory: "/var/lib/ovn"

        extraObjects:
          - apiVersion: kubeovn.io/v1
            kind: Subnet
            metadata:
              name: system-blackhole
            spec:
              protocol: IPv6
              cidrBlock: fd00:666::/64
              vpc: system-blackhole-vpc
              disableGatewayCheck: true
              # Block all traffic in that subnet
              acls:
              - action: drop
                direction: from-lport
                match: ip
              - action: drop
                direction: to-lport
                match: ip
              provider: system-blackhole.kube-system.ovn
          - apiVersion: kubeovn.io/v1
            kind: Vpc
            metadata:
              name: system-blackhole-vpc
            spec: {}
          - apiVersion: "k8s.cni.cncf.io/v1"
            kind: NetworkAttachmentDefinition
            metadata:
              name: system-blackhole
              namespace: kube-system
            spec:
              config: '{
                  "cniVersion": "0.3.0",
                  "type": "kube-ovn",
                  "server_socket": "/run/openvswitch/kube-ovn-daemon.sock",
                  "provider": "system-blackhole.kube-system.ovn"
                }'
          - apiVersion: kubeovn.io/v1
            kind: Subnet
            metadata:
              name: system-isolated-egress
            spec:
              # The CDI might reach both v4 and v6 IPs on the Internet, so we need both protocols.
              # We will NAT anyway (using the IP of the nodes), but we only do NAT44 and NAT66.
              # Maybe later we'll give a proper GUA of IPv6, but we cannot do it for IPv4 and 
              # Kube-OVN doesn't support NATing only the IPv4 side.
              protocol: Dual
              cidrBlock: 10.32.0.0/16,fd00:110::/64
              # Only the default VPC can do outgoing NAT, but it puts us at danger of lateral movements
              # This is mitigated by settings "private" to false and by adding a network policy blocking
              # everything except traffic going to the public Internet
              vpc: ovn-cluster
              # Any node can be a gateway
              gatewayType: distributed
              # We set MTU to 9000 on the interfaces. To prevent PMTUD problems, we restrict the MTU to the appropriate size for Geneve
              mtu: 1380
              acls:
              # Allow traffic to the DNS
              - action: allow-related
                direction: from-lport
                match: ip4.dst == 10.16.0.10 || ip6.dst == fd00:100:ffff::a
                priority: 1001

              # Allow the gateways
              - action: allow-related
                direction: from-lport
                match: ip4.src == 10.32.0.1 || ip6.src == fd00:110::1
                priority: 1001

              # Block IPv4 private CIDR (RFC1918)
              - action: drop
                direction: from-lport
                match: ip4.dst == 10.0.0.0/8 && ip4.dst != 10.32.0.1 && ip4.src == 10.0.0.0/8
                priority: 1000
              - action: drop
                direction: from-lport
                match: ip4.dst == 172.16.0.0/12 && ip
                priority: 1000
              - action: drop
                direction: from-lport
                match: ip4.dst == 192.168.0.0/16 && ip
                priority: 1000
              - action: drop
                direction: from-lport
                match: ip4.dst == 100.64.0.0/10 && ip
                priority: 1000
              - action: drop
                direction: from-lport
                match: ip4.dst == 169.254.0.0/16 && ip
                priority: 1000

              # Block IPv6 private CIDR
              - action: drop
                direction: from-lport
                match: ip6.dst == fc00::/7 && ip6.dst != fd00:110::1 && ip6.src == fd00:110::/64
                priority: 1000

              # Don't allow pods in the subnet to talk to each other
              allowEWTraffic: false

              # Egress using the IP of the nodes
              natOutgoing: true
              provider: system-isolated-egress.kube-system.ovn
          # Network attachment definition for CDI
          - apiVersion: "k8s.cni.cncf.io/v1"
            kind: NetworkAttachmentDefinition
            metadata:
              name: system-isolated-egress
              namespace: kube-system
            spec:
              config: '{
                  "cniVersion": "0.3.0",
                  "type": "kube-ovn",
                  "server_socket": "/run/openvswitch/kube-ovn-daemon.sock",
                  "provider": "system-isolated-egress.kube-system.ovn"
                }'

  # -- Multus is used for multi-attached pods/VMs
  multus:
    enabled: true
    wave: "-100"
    modes: [Hyperconverged, DecoupledVirtualization]
    automation:
      enabled: true
      selfHeal: true
      prune: true
      cleanupOnDeletion: false
      syncOptions: {}
    repoURL: oci://ghcr.io/super-phenix/charts/multus
    targetRevision: "0.1.0"
    namespace: kube-system
    helm:
      chart: multus
      releaseName: multus
      values:
        tolerations:
          - effect: NoSchedule
            operator: Exists
          - effect: NoExecute
            operator: Exists

  # -- Cilium is used as the CNI on storage clusters
  # TODO: Maybe phase out Cilium and use Kube-OVN everywhere?
  cilium:
    enabled: true
    wave: "-100"
    modes: [DecoupledStorage]
    automation:
      enabled: true
      selfHeal: true
      prune: true
      cleanupOnDeletion: false
      syncOptions: {}
    repoURL: https://helm.cilium.io/
    targetRevision: "1.17.2"
    namespace: kube-system
    helm:
      chart: cilium
      releaseName: cilium
      values:
        # We don't need the Envoy proxy
        envoy:
          enabled: false

        # Use the IP block allocated to each node, and not CiliumNodes, to reduce complexity
        ipam:
          mode: kubernetes

        # Talos needs a specific security context to allow Cilium to run
        securityContext:
          capabilities:
            ciliumAgent:
              - CHOWN
              - KILL
              - NET_ADMIN
              - NET_RAW
              - IPC_LOCK
              - SYS_ADMIN
              - SYS_RESOURCE
              - DAC_OVERRIDE
              - FOWNER
              - SETGID
              - SETUID
            cleanCiliumState:
              - NET_ADMIN
              - SYS_ADMIN
              - SYS_RESOURCE

        # Talos has the cgroups in a different location
        cgroup:
          autoMount:
            enabled: false
          hostRoot: /sys/fs/cgroup

        # Talos has a local loadbalancer (Kubeprism) to expose the controlplanes under one IP, it listens on localhost:7445
        k8sServiceHost: localhost
        k8sServicePort: 7445

        # Cilium will handle the function of kube-proxy
        kubeProxyReplacement: true

        # Do not startup if the K8s nodes are misconfigured and do not have both an IPv6 and IPv4 CIDR
        k8s:
          requireIPv4PodCIDR: true
          requireIPv6PodCIDR: true

        # Run Cilium in dual stack mode
        ipv4:
          enabled: true
        ipv6:
          enabled: true

        hubble:
          enabled: false

  # Metrics-server -- Pod metrics aggregator for HPA/VPA
  metrics-server:
    enabled: true
    wave: "-10"
    modes: [Hyperconverged, DecoupledStorage, DecoupledVirtualization]
    automation:
      enabled: true
      selfHeal: true
      prune: true
      cleanupOnDeletion: false
      syncOptions: {}
    namespace: "metrics-server-system"
    repoURL: "https://kubernetes-sigs.github.io/metrics-server/"
    targetRevision: "3.13.0"
    helm:
      chart: "metrics-server"
      releaseName: "metrics-server"
      values:
        replicas: 3
        metrics:
          enabled: true
        serviceMonitor:
          enabled: true
        defaultArgs:
          - --cert-dir=/tmp
          - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
          - --kubelet-use-node-status-port
          - --kubelet-insecure-tls
          - --metric-resolution=15s

  # Ingress-nginx -- Ingress controller
  # TODO: Phase out ingress-nginx and use Traefik from now on
  ingress-nginx:
    enabled: true
    wave: "-10"
    modes: [DecoupledStorage]
    automation:
      enabled: true
      selfHeal: true
      prune: true
      cleanupOnDeletion: false
      syncOptions: {}
    namespace: "ingress-nginx-system"
    nsLabels:
      pod-security.kubernetes.io/enforce: privileged
    repoURL: "https://kubernetes.github.io/ingress-nginx"
    targetRevision: "4.13.3"
    helm:
      chart: "ingress-nginx"
      releaseName: "ingress-nginx"
      values:
        controller:
          hostNetwork: true
          ingressClassResource:
            name: "spx-nginx"
          ingressClass: "spx-nginx"
          kind: DaemonSet
          containerPort:
            http: 80
            https: 443
          service:
            type: ClusterIP
            ports:
              http: 80
              https: 443
            targetPorts:
              http: 8080
              https: 8443
          config:
            hsts: "false"
            use-forwarded-headers: "true"
            enable-real-ip: "true"
            log-format-upstream: '{"msec": "$msec", "connection": "$connection", "connection_requests": "$connection_requests", "pid": "$pid", "request_id": "$request_id", "request_length": "$request_length", "remote_addr": "$remote_addr", "remote_user": "$remote_user", "remote_port": "$remote_port", "time_local": "$time_local", "time_iso8601": "$time_iso8601", "request": "$request", "request_uri": "$request_uri", "args": "$args", "status": "$status", "body_bytes_sent": "$body_bytes_sent", "bytes_sent": "$bytes_sent", "http_referer": "$http_referer", "http_user_agent": "$http_user_agent", "http_x_forwarded_for": "$http_x_forwarded_for", "http_host": "$http_host", "server_name": "$server_name", "request_time": "$request_time", "upstream": "$upstream_addr", "upstream_connect_time": "$upstream_connect_time", "upstream_header_time": "$upstream_header_time", "upstream_response_time": "$upstream_response_time", "upstream_response_length": "$upstream_response_length", "upstream_cache_status": "$upstream_cache_status", "ssl_protocol": "$ssl_protocol", "ssl_cipher": "$ssl_cipher", "scheme": "$scheme", "request_method": "$request_method", "server_protocol": "$server_protocol", "pipe": "$pipe", "gzip_ratio": "$gzip_ratio", "http_cf_ray": "$http_cf_ray"}'
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: prometheus
          # Tolerate to schedule on masters
          tolerations:
            - key: "node-role.kubernetes.io/master"
              operator: "Exists"
              effect: "NoSchedule"

  # Cert-manager -- Let's encrypt SSL certificate issuance operator
  cert-manager:
    enabled: true
    wave: "-10"
    modes: [Hyperconverged, DecoupledStorage, DecoupledVirtualization]
    automation:
      enabled: true
      selfHeal: true
      prune: true
      cleanupOnDeletion: false
      syncOptions: {}
    namespace: "cert-manager-system"
    repoURL: "https://charts.jetstack.io"
    targetRevision: "1.19.1"
    helm:
      chart: "cert-manager"
      releaseName: "cert-manager"
      values:
        enableCertificateOwnerRef: true
        crds:
          enabled: true
        prometheus:
          servicemonitor:
            enabled: true
        extraObjects:
          - |
            apiVersion: cert-manager.io/v1
            kind: ClusterIssuer
            metadata:
              name: letsencrypt
            spec:
              acme:
                # The ACME server URL
                server: https://acme-v02.api.letsencrypt.org/directory

                # Name of a secret used to store the ACME account private key
                privateKeySecretRef:
                  name: letsencrypt

                # Enable the HTTP-01 challenge provider
                solvers:
                - http01:
                    ingress:
                      class: traefik

  # Prometheus -- Metric aggregation and analysis
  prometheus-stack:
    enabled: true
    wave: "-5"
    modes: [Hyperconverged, DecoupledStorage, DecoupledVirtualization]
    automation:
      enabled: true
      selfHeal: true
      prune: true
      cleanupOnDeletion: false
      syncOptions:
        - ServerSideApply=true
    namespace: "prometheus-system"
    nsLabels:
      pod-security.kubernetes.io/enforce: privileged
    repoURL: "https://prometheus-community.github.io/helm-charts"
    targetRevision: "78.4.0"
    helm:
      chart: "kube-prometheus-stack"
      releaseName: "prometheus"
      values:
        # Talos has different selectors
        kubeEtcd:
          service:
            selector:
              k8s-app: kube-controller-manager

          serviceMonitor:
            relabelings: # Add nodename label
              - sourceLabels: [__meta_kubernetes_pod_node_name]
                separator: ;
                regex: ^(.*)$
                targetLabel: nodename
                replacement: $1
                action: replace
            metricRelabelings: # Remove pod label
              - action: labeldrop
                regex: pod

        # Talos has different selectors
        kubeScheduler:
          service:
            selector:
              k8s-app: kube-scheduler

        # Talos has different selectors
        kubeControllerManager:
          service:
            selector:
              k8s-app: kube-controller-manager

        defaultRules:
          create: false

        alertmanager:
          enabled: false

        grafana:
          ingress:
            enabled: true
            hosts:
              - "invalid"
            tls:
              - secretName: "grafana-tls"
                hosts:
                  - "invalid"
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt
          additionalDataSources:
            - name: Loki
              editable: false
              type: loki
              url: "http://loki.loki-system:3100"
              jsonData:
                httpHeaderName1: 'X-Scope-OrgID'
              secureJsonData:
                httpHeaderValue1: '1'
          adminPassword: ""

        prometheus:
          prometheusSpec:
            podMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            retention: 30d
            retentionSize: "45GB"
            storageSpec:
              volumeClaimTemplate:
                spec:
                  resources:
                    requests:
                      storage: 50Gi

  # Promtail -- Agent which ships the contents of local logs to a Loki instance
  promtail:
    enabled: true
    wave: "0"
    modes: [Hyperconverged, DecoupledStorage, DecoupledVirtualization]
    automation:
      enabled: true
      selfHeal: true
      prune: true
      cleanupOnDeletion: false
      syncOptions: {}
    namespace: "promtail-system"
    nsLabels:
      pod-security.kubernetes.io/enforce: privileged
    repoURL: "https://grafana.github.io/helm-charts"
    targetRevision: "6.17.0"
    helm:
      chart: "promtail"
      releaseName: "promtail"
      values:
        serviceMonitor:
          enabled: true
        config:
          clients:
            - url: http://loki.loki-system:3100/loki/api/v1/push
              tenant_id: 1

  # Loki -- Log aggregator with Prometheus-like query language
  loki:
    enabled: true
    wave: "-5"
    modes: [Hyperconverged, DecoupledStorage, DecoupledVirtualization]
    automation:
      enabled: true
      selfHeal: true
      prune: true
      cleanupOnDeletion: false
      syncOptions: {}
    namespace: "loki-system"
    repoURL: "https://grafana.github.io/helm-charts"
    targetRevision: "6.43.0"
    helm:
      chart: "loki"
      releaseName: "loki"
      values:
        deploymentMode: SingleBinary
        global:
          clusterDomain: ""
          dnsService: "coredns"
          dnsNamespace: "kube-system"
        loki:
          schemaConfig:
            configs:
              - from: 2024-12-01
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          compactor:
            compaction_interval: 10m
            retention_enabled: true
            retention_delete_delay: 2h
            retention_delete_worker_count: 150
            delete_request_store: filesystem
          limits_config:
            retention_period: 14d
          auth_enabled: true
          commonConfig:
            replication_factor: 1
          storage:
            type: 'filesystem'
        monitoring:
          serviceMonitor:
            enabled: true
        lokiCanary:
          enabled: false
        singleBinary:
          replicas: 1
          persistence:
            enableStatefulSetAutoDeletePVC: false
            size: 50Gi
        minio:
          enabled: false
        gateway:
          enabled: false
        test:
          enabled: false
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
        ingester:
          replicas: 0
        querier:
          replicas: 0
        queryFrontend:
          replicas: 0
        queryScheduler:
          replicas: 0
        distributor:
          replicas: 0
        compactor:
          replicas: 0
        indexGateway:
          replicas: 0
        bloomCompactor:
          replicas: 0
        bloomGateway:
          replicas: 0

  kubevirt:
    enabled: true
    wave: "5"
    modes: [Hyperconverged, DecoupledVirtualization]
    automation:
      enabled: true
      selfHeal: true
      prune: true
      cleanupOnDeletion: false
      syncOptions: {}
    namespace: "kubevirt-system"
    repoURL: "https://github.com/super-phenix/kubevirt-manifests.git"
    targetRevision: "HEAD"
    path: "v1.7.3/"
    directory:
      recurse: true

  # CDI -- Kubevirt CDI
  cdi:
    enabled: true
    wave: "5"
    modes: [Hyperconverged, DecoupledVirtualization]
    automation:
      enabled: true
      selfHeal: true
      prune: true
      cleanupOnDeletion: false
      syncOptions: {}
    namespace: "cdi-system"
    repoURL: "oci://ghcr.io/super-phenix/charts/cdi"
    targetRevision: "0.1.0"
    helm:
      chart: "cdi"
      releaseName: "cdi"

  # Rook Operator -- This must be enabled for any cluster that plans on interacting with Ceph/Rook.
  # Virtualization clusters need the operator to provision an external connection to a centralized
  # storage cluster, and centralized storage clusters need this operator to provision a local Ceph
  # cluster that will act as a remote backend for "client" clusters.
  rook-operator:
    enabled: true
    wave: "-5"
    modes: [Hyperconverged, DecoupledStorage, DecoupledVirtualization]
    automation:
      enabled: true
      selfHeal: true
      prune: true
      cleanupOnDeletion: false
      syncOptions: {}
    namespace: "rook-system"
    nsLabels:
      pod-security.kubernetes.io/enforce: privileged
    repoURL: "https://charts.rook.io/release"
    targetRevision: "1.16.5"
    helm:
      chart: "rook-ceph"
      releaseName: "rook-operator"
      values:
        # We want to bind to the IPv6 SPX storage network
        useOperatorHostNetwork: true
        enforceHostNetwork: true

        # Container Storage Interface
        csi:
          # Necessary for volume replication and mirroring
          csiAddons:
            enabled: true
          # Necessary for volume replication and mirroring
          enableOMAPGenerator: true
          # We need to bind the RBD on another port because of hostNetwork port conflicts
          csiAddonsRBDProvisionerPort: 9071
          # We don't do CephFS
          enableCephfsDriver: false
          # Monitoring config
          serviceMonitor:
            enabled: true

        monitoring:
          enabled: true

        # Discover new disks to show them on the dashboard
        enableDiscoveryDaemon: true
        discoveryDaemonInterval: 5m

        # Allow additional options on ObjectBucketClaims for self-service
        obcAllowAdditionalConfigFields: "maxObjects,maxSize,bucketMaxObjects,bucketMaxSize,bucketPolicy,bucketLifecycle"

  rook-local-cluster:
    enabled: true
    wave: "0"
    modes: [Hyperconverged, DecoupledStorage]
    automation:
      enabled: true
      selfHeal: true
      prune: true
      cleanupOnDeletion: false
      syncOptions: {}
    namespace: "spx-storage"
    nsLabels:
      pod-security.kubernetes.io/enforce: privileged
    repoURL: "https://charts.rook.io/release"
    targetRevision: "1.16.3"
    helm:
      chart: "rook-ceph-cluster"
      releaseName: "rook-local-cluster"
      values:
        operatorNamespace: rook-system
        clusterName: "invalid"
        toolbox:
          enabled: true
        monitoring:
          enabled: true

        ingress:
          dashboard:
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt
            host:
              name: "invalid"
              path: "/"
            tls:
              - hosts:
                  - "invalid"
                secretName: ceph-dashboard-tls

        cephClusterSpec:
          cephConfig:
            global:
              # Always move images to trash before fully deleting them
              # This is already enforced by the Ceph-CSI for K8s cluster, this option is here only to protect
              # manual removals done from the dashboard or from the toolbox
              rbd_move_to_trash_on_remove: "true"
              # Wait before purging RBD images that have been put into the trash, allowing for their recovery
              # This time is set to one week in seconds (7*24*60*60)
              rbd_move_to_trash_on_remove_expire_seconds: "604800"
              # Wait before propagating a mirroring relationship deletion to the remote cluster
              # This time is set to one week in seconds (7*24*60*60)
              rbd_mirroring_delete_delay: "604800"
              # How many snapshots we keep on the remote cluster before pruning
              rbd_mirroring_max_mirroring_snapshots: "30"

          dashboard:
            enabled: true
            ssl: false
            prometheusEndpoint: "http://prometheus-kube-prometheus-prometheus.prometheus-system:9090"
            prometheusEndpointSSLVerify: false

          mgr:
            modules:
              - name: rook
                enabled: true

          storage:
            useAllDevices: false
            deviceFilter: ""

          crashCollector:
            disable: false
            daysToRetain: 365

          network:
            # Use the underlying host network for performance and to expose the daemons to remote Ceph clients
            provider: host
            # We run Ceph only on IPv6 networks, bind the daemons on IPv6 addresses
            ipFamily: IPv6
            # This needs to be overriden for each cluster with the IPv6 ranges dedicated to handling storage traffic
            addressRanges:
              public:
                - invalid
              cluster:
                - invalid

        cephFileSystems: []
        cephObjectStores: []
        cephBlockPools:
          # We need to override the ".mgr" pool because it doesn't have a device class by default
          # This configuration ensures it has a device class of type "nvme"
          # TODO: remove
          - name: mgr
            spec:
              name: .mgr
              failureDomain: host
              deviceClass: nvme
              replicated:
                size: 3
                requireSafeReplicaSize: true
              parameters:
                compression_mode: none
              mirroring:
                enabled: false
              enableCrushUpdates: true
            storageClass:
              enabled: false

          # Block storage used locally by the storage cluster for its internal needs
          # FS type is EXT4 because it is running hyperconverged (XFS can deadlock in that scenario)
          # Replication is set to only 2 because the data is considered non-critical (logs, metrics...)
          - name: spx-scratchpad
            spec:
              failureDomain: host
              enableRBDStats: true
              deviceClass: nvme
              replicated:
                size: 2
              enableCrushUpdates: true
            storageClass:
              enabled: true
              name: spx-scratchpad
              isDefault: true
              reclaimPolicy: Delete
              allowVolumeExpansion: true
              volumeBindingMode: "Immediate"
              parameters:
                imageFormat: "2"
                imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
                csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
                csi.storage.k8s.io/provisioner-secret-namespace: "spx-storage"
                csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
                csi.storage.k8s.io/controller-expand-secret-namespace: "spx-storage"
                csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
                csi.storage.k8s.io/node-stage-secret-namespace: "spx-storage"
                csi.storage.k8s.io/fstype: ext4
              mountOptions:
                - discard

  rook-connection:
    enabled: true
    wave: "0"
    modes: [DecoupledVirtualization]
    automation:
      enabled: true
      selfHeal: true
      prune: true
      cleanupOnDeletion: false
      # The endpoint ConfigMap is edited on the fly by Rook and must be ignored during syncs, unless it doesn't exist on the cluster
      syncOptions:
        - RespectIgnoreDifferences=true
    namespace: "rook-system"
    nsLabels:
      pod-security.kubernetes.io/enforce: privileged
    # The endpoint ConfigMap is edited on the fly by Rook and must be ignored from diffs when it changes
    ignoreDifferences:
      - kind: ConfigMap
        jsonPointers:
          - /data/data
          - /data/mapping
    repoURL: "oci://ghcr.io/super-phenix/charts/spx-rook-connection"
    path: "."
    targetRevision: "0.1.1"
    helm:
      chart: "spx-rook-connection"
      releaseName: "spx-rook-connection"

  volume-replicator:
    enabled: true
    modes: [Hyperconverged, DecoupledVirtualization]
    automation:
      enabled: true
      selfHeal: true
      prune: true
      cleanupOnDeletion: false
      syncOptions: {}
    namespace: "volume-replicator"
    repoURL: "ghcr.io/super-phenix/helm-charts"
    targetRevision: "0.5.1"
    helm:
      chart: "volume-replicator"
      releaseName: "volume-replicator"
      values:
        exclusionRegex: "^prime-.*$"

  # Policies -- Used to enforce SPX RFCs and protect against bugs/attacks
  policies:
    enabled: true
    modes: [Hyperconverged, DecoupledVirtualization]
    automation:
      enabled: true
      selfHeal: true
      prune: true
      cleanupOnDeletion: false
