    targetRevision: "0.1.0"
    helm:
      chart: "csi-addons"
      releaseName: "csi-addons"

  # CSI-Snapshotter -- Used to add VolumeSnapshots to the CSI
  csi-snapshotter:
    enabled: true
    wave: "0"
    modes: [Hyperconverged, DecoupledVirtualization]
    automation:
      enabled: true
      selfHeal: true
      prune: true
      cleanupOnDeletion: false
      syncOptions: {}
    namespace: "csi-snapshotter-system"
    repoURL: "oci://ghcr.io/super-phenix/charts/external-snapshotter"
    path: "."
    targetRevision: "0.1.0"
    helm:
      chart: "external-snapshotter"
      releaseName: "external-snapshotter"

  # Kyverno -- Used to correctly set VolumeSnapshotClass/VolumeReplicationClass (ideally removed ASAP)
  kyverno:
    enabled: true
    wave: "0"
    modes: [Hyperconverged, DecoupledVirtualization]
    automation:
      enabled: true
      selfHeal: true
      prune: true
      cleanupOnDeletion: false
      syncOptions: {}
    namespace: "kyverno-system"
    repoURL: "https://kyverno.github.io/kyverno/"
    targetRevision: "3.6.0"
    helm:
      chart: "kyverno"
      releaseName: "kyverno"
      values:
        # Unnecessary controller doing high CPU usage under unknown circumstances
        reportsController:
          enabled: false

  # Snapscheduler -- Used to schedule snapshots of volumes
  snapscheduler:
    enabled: true
    wave: "0"
    modes: [Hyperconverged, DecoupledVirtualization]
    automation:
      enabled: true
      selfHeal: true
      prune: true
      cleanupOnDeletion: false
      syncOptions: {}
    namespace: "snapscheduler-system"
    repoURL: "https://backube.github.io/helm-charts/"
    targetRevision: "*"
    helm:
      chart: snapscheduler
      releaseName: "snapscheduler"
      values:
        # Run the controller HA
        replicaCount: 2

        # Make the snapshots owned by the schedule so that they get garbage collected if the
        # schedule is ever deleted
        enableOwnerReferences: true


