  # Gateway-API -- Gateway API CRDs
  gateway-api:
    enabled: true
    wave: "0"
    modes: [Hyperconverged, DecoupledVirtualization]
    automation:
      enabled: true
      selfHeal: true
      prune: true
      cleanupOnDeletion: false
      syncOptions: {}
    namespace: "kube-system"
    repoURL: "https://github.com/kubernetes-sigs/gateway-api.git"
    targetRevision: "v1.6.1"
    path: "config/crd/standard"
    directory:
      recurse: true

  # Traefik -- Gateway API & ingress controller
  traefik:
    enabled: true
    wave: "0"
    modes: [Hyperconverged, DecoupledVirtualization]
    automation:
      enabled: true
      selfHeal: true
      prune: true
      cleanupOnDeletion: false
      syncOptions: {}
    namespace: "traefik-system"
    nsLabels:
      pod-security.kubernetes.io/enforce: privileged
    repoURL: "https://traefik.github.io/charts"
    targetRevision: "41.0.1" # https://github.com/traefik/traefik-helm-chart/releases
    helm:
      chart: "traefik"
      releaseName: "traefik"
      values:
        # -- Disable logs signaling about new versions
        global:
          checkNewVersion: false

        # -- Deploy Traefik as a DaemonSet so that every node can receive traffic
        deployment:
          enabled: true
          kind: DaemonSet

        # -- Use a ClusterIP instead of a LoadBalancer, as we're deploying on baremetal
        service:
          type: ClusterIP

        # -- We're deploying on baremetal (maybe replace by hostPort in .ports structure?)
        hostNetwork: true

        # -- Gateway API default gateway (we do not use it)
        gateway:
          enabled: false

        gatewayClass:
          enabled: true
          name: traefik

        # -- Enable the access logs within the Traefik pods
        accessLog:
          enabled: true

        # -- Security context to bind on port < 1024 (80 and 443)
        securityContext:
          capabilities:
            drop:
              - ALL
            add:
              - NET_BIND_SERVICE
        podSecurityContext:
          runAsGroup: 0
          runAsUser: 0
          runAsNonRoot: false

        # -- Ports on which Traefik listens
        ports:
          # -- HTTP
          web:
            port: 80
          # -- HTTPS
          websecure:
            port: 443
          # -- KaaS HTTPS API server
          kaas-https:
            port: 7443
            exposedPort: 7443
            expose:
              default: true
            protocol: TCP
            http:
              tls:
                enabled: true
          # -- KaaS TLS API server (HAProxy)
          kaas-api-tls:
            port: 7444
            exposedPort: 7444
            expose:
              default: true
            protocol: TCP
            http:
              tls:
                enabled: true
          # -- KaaS Konnectivity server
          kaas-konnectivity:
            port: 7442
            exposedPort: 7442
            expose:
              default: true
            protocol: TCP
            http:
              tls:
                enabled: true
          metrics:
            port: 9101
            exposedPort: 9101

        # -- We do not use the dashboard by default to save on compute and RAM
        api:
          dashboard: false

        # -- Create a Traefik default ingress class
        ingressClass:
          enabled: true

        # -- Update strategy for hostNetwork deployment
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
            maxSurge: 0

        # -- We're listening for ingress-nginx annotations to support previous deployments
        providers:
          kubernetesIngressNGINX:
            enabled: true
            watchIngressWithoutClass: true
          kubernetesGateway:
            enabled: true
