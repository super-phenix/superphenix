apiVersion: apps/v1
kind: Deployment
metadata:
  name: superphenix-operator
  labels:
    {{- include "superphenix-operator.labels" . | nindent 4 }}
spec:
  {{- if .Values.installOnClusterWithoutCNI }}
  strategy:
    type: Recreate
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "superphenix-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "superphenix-operator.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.installOnClusterWithoutCNI }}
      hostNetwork: true
      dnsPolicy: Default
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "superphenix-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            - --health-probe-bind-address={{ include "superphenix-operator.healthProbeBindAddress" . }}
            - --metrics-bind-address={{ .Values.metrics.bindAddress }}
            - --metrics-secure={{ .Values.metrics.secure }}
            {{- if .Values.config.argocd.chart }}
            {{- if .Values.config.argocd.chart.url }}
            - --argocd-chart-url={{ .Values.config.argocd.chart.url }}
            {{- end }}
            {{- if .Values.config.argocd.chart.version }}
            - --argocd-chart-version={{ .Values.config.argocd.chart.version }}
            {{- end }}
            {{- end }}
            - --values-configmap-name={{ .Values.config.valuesConfigMap.name }}
            - --clusters-configmap-name={{ .Values.config.clustersConfigMap.name }}
            - --operator-namespace=$(OPERATOR_NAMESPACE)
            - --argocd-default-config=/etc/superphenix/argocd/default/values.yaml
            - --argocd-ha-config=/etc/superphenix/argocd/ha/values.yaml
            {{- if .Values.config.system.repoURL }}
            - --system-chart-url={{ .Values.config.system.repoURL }}
            {{- end }}
            {{- if .Values.config.system.chartName }}
            - --system-chart-name={{ .Values.config.system.chartName }}
            {{- end }}
            - --system-chart-version={{ .Values.config.system.version | default .Chart.AppVersion }}
            {{- if .Values.config.talosManager.chart.url }}
            - --talos-manager-chart-url={{ .Values.config.talosManager.chart.url }}
            {{- end }}
            {{- if .Values.config.talosManager.chart.version }}
            - --talos-manager-chart-version={{ .Values.config.talosManager.chart.version }}
            {{- end }}
            {{- if .Values.config.syncPeriod }}
            - --sync-period={{ .Values.config.syncPeriod }}
            {{- end }}
            {{- if .Values.config.syncTimeout }}
            - --sync-timeout={{ .Values.config.syncTimeout }}
            {{- end }}
            {{- if .Values.config.telemetry.disabled }}
            - --disable-telemetry
            {{- end }}
            {{- if .Values.config.telemetry.endpoint }}
            - --telemetry-endpoint={{ .Values.config.telemetry.endpoint }}
            {{- end }}
            {{- if .Values.config.enableHTTP2 }}
            - --enable-http2
            {{- end }}
            {{- if .Values.config.disableVersionValidation }}
            - --disable-version-validation
            {{- end }}
            {{- if .Values.config.argocd.ha.enabled }}
            - --ha-enabled=true
            {{- end }}
            {{- if .Values.installOnClusterWithoutCNI }}
            - --install-without-cni
            {{- end }}
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            {{- end }}
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ include "superphenix-operator.healthProbePort" . | int }}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ include "superphenix-operator.healthProbePort" . | int }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: argocd-default-config
              mountPath: /etc/superphenix/argocd/default
              readOnly: true
            - name: argocd-ha-config
              mountPath: /etc/superphenix/argocd/ha
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: argocd-default-config
          configMap:
            name: superphenix-mgmt-argocd-default-config
        - name: argocd-ha-config
          configMap:
            name: superphenix-mgmt-argocd-ha-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.installOnClusterWithoutCNI .Values.tolerations }}
      tolerations:
        {{- if .Values.installOnClusterWithoutCNI }}
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoSchedule"
        {{- end }}
        {{- with .Values.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
