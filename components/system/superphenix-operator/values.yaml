# -- String to partially override fullname template.
nameOverride: ""
# -- String to fully override fullname template.
fullnameOverride: ""

# -- Number of replicas for the operator deployment.
replicaCount: 1

leaderElection:
  # -- Enable leader election for the operator, necessary if running multiple replicas.
  enabled: false

# -- Metrics and Health configuration.
metrics:
  # -- The address the metric endpoint binds to. Use "0" to disable.
  bindAddress: "0" # Disable by default
  # -- Whether to secure the metrics endpoint with TLS.
  secure: true

health:
  # -- The address the health probe endpoint binds to.
  probeBindAddress: ":8081"

image:
  # -- Repository for the operator image.
  repository: ghcr.io/super-phenix/superphenix-operator
  # -- Pull policy for the operator image.
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""

# -- Secrets for pulling the operator image.
imagePullSecrets: []

serviceAccount:
  # -- Specifies whether a service account should be created.
  create: true
  # -- Annotations to add to the service account.
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# -- Annotations for the operator pods.
podAnnotations: {}

# -- Pod-level security context.
podSecurityContext:
  # -- Whether to run as a non-root user.
  runAsNonRoot: true
  seccompProfile:
    # -- Type of seccomp profile to use.
    type: RuntimeDefault

# -- Container-level security context.
securityContext:
  # -- Whether to mount the container's root filesystem as read-only.
  readOnlyRootFilesystem: true
  # -- Whether to allow privilege escalation.
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

# -- Resource limits and requests for the operator container.
resources:
  limits:
    # -- CPU limit for the operator.
    cpu: 500m
    # -- Memory limit for the operator.
    memory: 256Mi
  requests:
    # -- CPU request for the operator.
    cpu: 10m
    # -- Memory request for the operator.
    memory: 64Mi

# -- Node selector for pod assignment.
nodeSelector: {}
# -- Tolerations for pod assignment.
tolerations: []
# -- Affinity rules for pod assignment.
affinity: {}

# -- Superphenix operator configuration
config:
  # -- General ConfigMap holding Helm values overrides for all management components.
  valuesConfigMap:
    name: superphenix-mgmt-values

  # -- ConfigMap where all clusters will append their configuration.
  clustersConfigMap:
    name: superphenix-clusters-config

  # -- Interval at which to periodically resync sub-applications.
  syncPeriod: 5m
  # -- Duration after which an in-progress sub-application sync is considered stuck.
  syncTimeout: 15m

  # -- Telemetry settings.
  telemetry:
    # -- Disable sending anonymous telemetry.
    disabled: false
    # -- URL of the telemetry ingest endpoint.
    # endpoint: ""

  # -- Enable HTTP/2 for the metrics and webhook servers.
  enableHTTP2: false

  argocd:
    # -- ArgoCD configuration.
    ha:
      # -- Enable HA mode for ArgoCD deployment.
      enabled: false
    # -- Arbitrary Helm values merged under the "argocd" ConfigMap key.
    values: {}

  management:
    # -- Arbitrary Helm values merged under the "superphenix" ConfigMap key.
    values: {}

  # -- Default system chart deployed by the cluster controller on every managed cluster.
  # This can be overridden per cluster in the Cluster CR.
  system:
    # -- Repository URL for the system chart.
    repoURL: ghcr.io/super-phenix/charts
    # -- Name of the system chart.
    chartName: superphenix-system
    # -- Version of the system chart. If none provided, inherits from the operator chart.
    version: ""

  # -- talos-manager chart deployed by the cluster controller for every managed cluster.
  talosManager:
    chart:
      # -- Repository URL for the talos-manager chart.
      url: ghcr.io/super-phenix/charts
      # -- Version of the talos-manager chart.
      version: 0.1.0

# -- Superphenix management cluster configuration.
# This will create a Cluster resource for the management cluster, pointing to the Kubernetes cluster
# where the operator is installed. Only management configuration can be defined here. If you also want
# to install a Storage/Workload/Hyperconverged cluster on the Kubernetes cluster where the operator is installed,
# you need to create a separate Cluster CR manually or use the 'clusters' field below.
management:
  # -- Region where the management cluster is located.
  # This is optional, as the cluster will not be visible to end users.
  # Defaults to "management".
  region: ""
  # -- Availability zone where the management cluster is located.
  # This is optional, as the cluster will not be visible to end users.
  # Defaults to "management".
  availabilityZone: ""

  # -- Override the default Superphenix system chart repository.
  # This is useful if you want to use a custom chart.
  repoURL: ""
  # -- Override the default Superphenix system chart name.
  # This is useful if you want to use a custom chart.
  chartName: ""
  # -- Override the default Superphenix system chart version.
  # This is useful if you want to use a custom chart.
  version: ""

  # -- Whether to pause the synchronization of the Superphenix stack on the management cluster.
  pauseSync: false
  # -- Whether to disable the autosync of all applications on the management cluster.
  manual: false
  # -- Whether to clean up resources deployed by the management stack applications when they get deleted.
  cleanupOnDeletion: true

  # -- System configuration for the management stack.
  # This configuration is passed to the superphenix-system chart.
  systemConfiguration: {}

# -- Superphenix clusters to be managed by this operator.
# You can either create the Cluster CRs by hand or use this field to define your clusters from the chart.
clusters: {}
#  example-cluster:
#    # DeploymentTopology defines whether the cluster is part of an hyperconverged or decoupled deployment.
#    # Accepted values: Hyperconverged, Decoupled
#    deploymentTopology: Hyperconverged
