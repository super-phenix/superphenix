replicaCount: 1

image:
  repository: ghcr.io/super-phenix/superphenix-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Operator configuration
config:
  isManagementCluster: true

  # General ConfigMap holding Helm values overrides for all management components.
  valuesConfigMap:
    name: superphenix-mgmt-values

  # ConfigMap where all clusters will append their configuration.
  clustersConfigMap:
    name: superphenix-clusters-config

  argocd:
    # chart:
    #  url: https://argoproj.github.io/argo-helm
    #  version: 9.7.0
    ha:
      enabled: false
    # Arbitrary Helm values merged under the "argocd" ConfigMap key.
    values: {}

  management:
    chart:
      url: ghcr.io/super-phenix/charts
      # If none provided, inherits the version from the superphenix-operator chart
      version: ""
    # Arbitrary Helm values merged under the "superphenix" ConfigMap key.
    values: {}

  # System chart deployed by the cluster controller on every managed cluster.
  system:
    repoURL: ghcr.io/super-phenix/charts
    chartName: superphenix-system
    # If none provided, inherits the version from the superphenix-operator chart
    version: ""

  # talos-manager chart deployed by the cluster controller for every managed cluster.
  talosManager:
    chart:
      url: ghcr.io/super-phenix/charts
      version: 0.1.0

# Metrics and Health
metrics:
  bindAddress: "0" # Disable by default
  secure: true

health:
  probeBindAddress: ":8081"

leaderElection:
  enabled: false

# Superphenix clusters to be managed by this operator.
clusters: {}
#  example-cluster:
#    # DeploymentTopology defines whether the cluster is part of an hyperconverged or decoupled deployment.
#    # Accepted values: hyperconverged, decoupled
