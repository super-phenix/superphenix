#    # type: Storage
#
#    # TalosManagementMode specifies how Talos configuration should be managed.
#    # Unmanaged (default) - The Talos cluster is not managed by the operator. This requires an externally managed installation and configuration of Talos.
#    # Import - The operator imports an already installed Talos cluster and manages its configuration.
#    # Full - The Talos cluster is fully installed and configured by the operator.
#    # Accepted values: Unmanaged, Import, Full
#    talosManagementMode: Unmanaged
#
#    # Region is the geographic region where this cluster is located.
#    region: us
#
#    # AvailabilityZone is the availability zone identifier within the region.
#    availabilityZone: east-1
#
