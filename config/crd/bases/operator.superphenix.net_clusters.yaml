---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: clusters.operator.superphenix.net
spec:
  group: operator.superphenix.net
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.deploymentTopology
      name: Topology
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.region
      name: Region
      type: string
    - jsonPath: .spec.availabilityZone
      name: AZ
      type: string
    - jsonPath: .status.superphenixVersion
      name: SPX version
      type: string
    - jsonPath: .status.kubernetesVersion
      name: K8S version
      type: string
    - jsonPath: .status.nodeCount
      name: Nodes
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Cluster represents a Superphenix cluster deployment.
          A cluster is an availability zone (AZ) where the full Superphenix stack is deployed.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of Cluster.
            properties:
              availabilityZone:
                description: AvailabilityZone is the availability zone identifier
                  within the region.
                minLength: 1
                type: string
              chartName:
                description: |-
                  ChartName is the name of the Superphenix system chart.
                  If not specified, the default value from the controller configuration is used.
                type: string
              cleanupOnDeletion:
                default: false
                description: |-
                  CleanupOnDeletion allows the cleanup of the cluster when it gets deleted.
                  When set to true, deleting the cluster resource will automatically propagate the deletion
                  to the target, with every application getting cascade deleted. This option is dangerous
                  and should usually be set to true only before a deletion is planned to avoid any accident.
                type: boolean
              connection:
                description: Connection defines the parameters to connect to the remote
                  cluster.
                properties:
                  mode:
                    default: Local
                    description: Mode specifies the connection mode (Remote or Local).
                    enum:
                    - Remote
                    - Local
                    type: string
                  secretRef:
                    description: |-
                      SecretRef is a reference to a secret containing the connection credentials.
                      This is required when Mode is Remote and ignored when Mode is Local.
                    properties:
                      name:
                        description: Name of the secret
                        type: string
                      namespace:
                        description: Namespace of the secret. If empty, the namespace
                          of the Cluster is used.
                        type: string
                    required:
                    - name
                    type: object
                  url:
                    description: |-
                      URL is the address of the remote cluster API server.
                      This is required when Mode is Remote and ignored when Mode is Local.
                    type: string
                required:
                - mode
                type: object
              deploymentTopology:
                allOf:
                - enum:
                  - Hyperconverged
                  - Decoupled
                - enum:
                  - Hyperconverged
                  - Decoupled
                description: DeploymentTopology defines whether the cluster is hyperconverged
                  or decoupled.
                type: string
              manual:
                default: false
                description: |-
                  Manual allows to disable the autosync of all applications on this cluster.
                  When set to true, "forceManual" is passed to the Superphenix system chart.
                type: boolean
              pauseSync:
                default: false
                description: |-
                  PauseSync allows to temporarily pause the synchronization of the Superphenix stack on this cluster.
                  When set to true, an ArgoCD sync window is added to the cluster's project to prevent any automated or manual sync.
                type: boolean
              region:
                description: Region is the geographic region where this cluster is
                  located.
                minLength: 1
                type: string
              repoURL:
                description: |-
                  RepoURL is the URL of the repository where the Superphenix system chart is located.
                  If not specified, the default value from the controller configuration is used.
                type: string
              systemConfiguration:
                description: SystemConfiguration is a YAML dict of unknown values
                  that will be passed to the system configuration chart.
                x-kubernetes-preserve-unknown-fields: true
              talosManagementMode:
                allOf:
                - enum:
                  - Unmanaged
                  - Import
                  - Full
                - enum:
                  - Unmanaged
                  - Import
                  - Full
                default: Unmanaged
                description: TalosManagementMode specifies how Talos configuration
                  should be managed.
                type: string
              talosManagerConfiguration:
                description: TalosManagerConfiguration is a YAML dict of unknown values
                  that will be passed to the talos-manager chart.
                x-kubernetes-preserve-unknown-fields: true
              type:
                description: |-
                  Type specifies the cluster type (Storage or Virtualization) when DeploymentTopology is Decoupled.
                  This field can only be set when DeploymentTopology is Decoupled and is ignored otherwise.
                enum:
                - Storage
                - Virtualization
                type: string
              version:
                description: |-
                  Version is the Superphenix version for this cluster.
                  It must follow semantic versioning.
                  If not specified, the default value from the controller configuration is used.
                pattern: ^v?([0-9]+)(\.[0-9]+)?(\.[0-9]+)?(-([0-9A-Za-z\-.]+))?(\+([0-9A-Za-z\-.]+))?$
                type: string
            required:
            - availabilityZone
            - connection
            - deploymentTopology
            - region
            type: object
          status:
            description: Status defines the observed state of Cluster.
            properties:
              apps:
                additionalProperties:
                  description: |-
                    ClusterApp reports the observed state of a single application belonging to the
                    cluster's app-of-apps tree.
                  properties:
                    lastRefresh:
                      description: LastRefresh is the last time ArgoCD reconciled
                        the Application against its source.
                      format: date-time
                      type: string
                    lastSync:
                      description: LastSync is the last time a sync operation on the
                        Application completed.
                      format: date-time
                      type: string
                    name:
                      description: Name is the application name.
                      type: string
                    status:
                      description: Status is the health status of the Application
                        (e.g. Healthy, Degraded, Progressing).
                      type: string
                    version:
                      description: Version is the target revision of the Application
                        source.
                      type: string
                  required:
                  - name
                  type: object
                description: |-
                  Apps reports the state of each application deployed by the cluster's root
                  app-of-apps, keyed by application name.
                type: object
              cephClusters:
                additionalProperties:
                  x-kubernetes-preserve-unknown-fields: true
                description: |-
                  CephClusters reports the state of each Ceph cluster running on the SPX cluster,
                  keyed by their FSID.
                type: object
              conditions:
                description: |-
                  Conditions represent the current state of the Cluster resource.
                  Standard condition types include:
                  - "Ready": the cluster is fully operational
                  - "Progressing": the cluster is being provisioned or updated
                  - "Degraded": the cluster has encountered issues
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              kubernetesVersion:
                description: KubernetesVersion is the version of the Kubernetes cluster.
                type: string
              lastSync:
                description: LastSync is the last time a sync was performed on the
                  cluster.
                format: date-time
                type: string
              nodeCount:
                description: NodeCount is the number of nodes in the cluster.
                type: integer
              observedGeneration:
                description: ObservedGeneration reflects the generation of the most
                  recently observed Cluster.
                format: int64
                type: integer
              phase:
                description: Phase represents the current phase of the cluster lifecycle.
                enum:
                - Deployed
                - Deploying
                - OutOfSync
                - Error
                - Paused
                - Unknown
                type: string
              superphenixVersion:
                description: SuperphenixVersion is the actual Superphenix version
                  currently running on the cluster.
                type: string
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
