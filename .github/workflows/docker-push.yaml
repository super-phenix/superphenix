name: Push Docker Images to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  # Allow manual trigger for testing
  workflow_dispatch:
env:
  GIT_DEPTH: 1

jobs:
  push-images:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ env.GIT_DEPTH }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Images
        run: |
          set -e
          REGISTRY="ghcr.io/${{ github.repository_owner }}"
          
          # Identify changed files if not a manual trigger or new branch/tag
          ALL_CHANGED=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual trigger: building all components."
            ALL_CHANGED=true
          else
            BEFORE="${{ github.event.before }}"
            if [[ "$BEFORE" == "0000000000000000000000000000000000000000" || -z "$BEFORE" ]]; then
              echo "New branch/tag or initial push: building all components."
              ALL_CHANGED=true
            else
              echo "Detecting changes between $BEFORE and ${{ github.sha }}"
              
              # Check if BEFORE commit exists, fetch if not
              if ! git rev-parse --quiet --verify "${BEFORE}^{commit}" >/dev/null 2>&1; then
                echo "Commit $BEFORE not found locally. Attempting to fetch..."
                git fetch origin "$BEFORE" --depth 1 --no-tags || git fetch origin "$BEFORE" --no-tags || true
              fi

              if git rev-parse --quiet --verify "${BEFORE}^{commit}" >/dev/null 2>&1; then
                # Use || echo "DIFF_FAILED" to avoid exiting if git diff fails under set -e
                CHANGED_FILES=$(git diff --name-only "$BEFORE" "${{ github.sha }}" || echo "DIFF_FAILED")
                if [[ "$CHANGED_FILES" == "DIFF_FAILED" ]]; then
                  echo "Warning: git diff failed. Processing all components."
                  ALL_CHANGED=true
                fi
              else
                echo "Warning: Commit $BEFORE not found. Processing all components."
                ALL_CHANGED=true
              fi
            fi
          fi

          # Find all "docker" directories within components
          find components -type d -name "docker" | while read -r docker_dir; do
            if [ -f "$docker_dir/Dockerfile" ]; then
              # Get the component name (parent directory of the docker folder)
              COMPONENT_DIR=$(dirname "$docker_dir")
              COMPONENT_NAME=$(basename "$COMPONENT_DIR")

              if [[ "$ALL_CHANGED" != "true" ]]; then
                if ! echo "$CHANGED_FILES" | grep -qE "^$COMPONENT_DIR(/|$)"; then
                  echo "Skipping component: $COMPONENT_NAME (no changes in $COMPONENT_DIR)"
                  continue
                fi
              fi

              IMAGE_NAME="${REGISTRY}/${COMPONENT_NAME}"
              
              echo "Processing Docker image for component: $COMPONENT_NAME"
              echo "Directory: $docker_dir"

              # Determine the tag and version
              TAGS=""
              VERSION_ARG="dev"
              if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
                # Tagged build
                TAGS="${IMAGE_NAME}:${{ github.ref_name }}"
                VERSION_ARG="${{ github.ref_name }}"
              elif [[ "${{ github.ref_name }}" == "main" ]]; then
                # Main branch build
                TAGS="${IMAGE_NAME}:latest"
                VERSION_ARG="latest"
              fi

              # Check if a custom make target exists for this component
              MAKE_TARGET="docker-build-${COMPONENT_NAME}"
              if grep -q "^${MAKE_TARGET}:" Makefile; then
                echo "Found specific make target: $MAKE_TARGET"
                if [ -n "$TAGS" ]; then
                  echo "Building and pushing $TAGS using make"
                  make "$MAKE_TARGET" IMG="$TAGS" VERSION="$VERSION_ARG"
                  docker push "$TAGS"
                else
                  echo "No tag determined, building temp image using make"
                  make "$MAKE_TARGET" IMG="${IMAGE_NAME}:temp" VERSION="$VERSION_ARG"
                fi
              else
                if [ -n "$TAGS" ]; then
                  echo "Building and pushing $TAGS"
                  # Use --tag for each tag identified
                  # Run from project root to ensure Docker context has access to go.mod etc.
                  docker build -t "$TAGS" --build-arg VERSION="$VERSION_ARG" -f "$docker_dir/Dockerfile" .
                  docker push "$TAGS"
                else
                  echo "No tag determined (not on main or tag), skipping push."
                  docker build -t "${IMAGE_NAME}:temp" --build-arg VERSION="$VERSION_ARG" -f "$docker_dir/Dockerfile" .
                fi
              fi
            else
              echo "No Dockerfile found in $docker_dir, skipping."
            fi
          done

          find components/dependencies -name "Makefile" | while read -r makefile; do
            dir=$(dirname "$makefile")
            COMPONENT_NAME=$(basename "$dir")

            if [[ "$ALL_CHANGED" != "true" ]]; then
              if ! echo "$CHANGED_FILES" | grep -qE "^$dir(/|$)"; then
                echo "Skipping component: $COMPONENT_NAME (no changes in $dir)"
                continue
              fi
            fi

            IMAGE_NAME="${REGISTRY}/${COMPONENT_NAME}"

            echo "Processing Makefile for component: $COMPONENT_NAME in $dir"

            # Determine SPX_VERSION for the Makefile
            if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
              SPX_VERSION="${{ github.ref_name }}"
              DO_PUSH=true
            elif [[ "${{ github.ref_name }}" == "main" ]]; then
              SPX_VERSION="latest"
              DO_PUSH=true
            else
              SPX_VERSION="temp"
              DO_PUSH=false
            fi

            echo "Running 'make build' for $COMPONENT_NAME (SPX_VERSION=$SPX_VERSION)"
            make -C "$dir" build IMAGE="$IMAGE_NAME" SPX_VERSION="$SPX_VERSION"

            if [ "$DO_PUSH" = true ]; then
              echo "Running 'make push' for $COMPONENT_NAME"
              make -C "$dir" push IMAGE="$IMAGE_NAME" SPX_VERSION="$SPX_VERSION"
            fi
          done
